<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="120" height="40">
  <defs>
    <linearGradient id="sunGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <!-- Small sun mark -->
  <g transform="translate(4, 4)">
    <line x1="0" y1="20" x2="24" y2="20" stroke="#334155" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 4 20 A 8 8 0 0 1 20 20" fill="url(#sunGradC)"/>
    <line x1="12" y1="2" x2="12" y2="7" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="5" y1="5" x2="7.5" y2="9" stroke="#FBBF24" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="19" y1="5" x2="16.5" y2="9" stroke="#FBBF24" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- LUMI text -->
  <text x="34" y="22" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="3" fill="#FFFFFF">LUMI</text>

  <!-- Tiny StayOS underneath -->
  <text x="34" y="34" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" font-weight="500" letter-spacing="1" fill="#9c7cff">StayOS</text>
</svg>
