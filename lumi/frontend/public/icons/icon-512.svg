<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bgGradient)"/>
  <!-- Horizon line -->
  <line x1="96" y1="310" x2="416" y2="310" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
  <!-- Rising sun -->
  <path d="M 160 310 A 96 96 0 0 1 352 310" fill="url(#sunGradient)"/>
  <!-- Light rays -->
  <line x1="256" y1="120" x2="256" y2="160" stroke="#FBBF24" stroke-width="12" stroke-linecap="round"/>
  <line x1="168" y1="152" x2="184" y2="184" stroke="#FBBF24" stroke-width="10" stroke-linecap="round"/>
  <line x1="344" y1="152" x2="328" y2="184" stroke="#FBBF24" stroke-width="10" stroke-linecap="round"/>
  <line x1="120" y1="216" x2="144" y2="232" stroke="#FBBF24" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <line x1="392" y1="216" x2="368" y2="232" stroke="#FBBF24" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <!-- LUMI text -->
  <text x="256" y="410" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="500" letter-spacing="16" fill="#F8FAFC">LUMI</text>
</svg>
