<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="36" ry="36" fill="url(#bgGradient)"/>
  <!-- Horizon line -->
  <line x1="36" y1="116" x2="156" y2="116" stroke="#475569" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Rising sun -->
  <path d="M 60 116 A 36 36 0 0 1 132 116" fill="url(#sunGradient)"/>
  <!-- Light rays -->
  <line x1="96" y1="45" x2="96" y2="60" stroke="#FBBF24" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="63" y1="57" x2="69" y2="69" stroke="#FBBF24" stroke-width="3.8" stroke-linecap="round"/>
  <line x1="129" y1="57" x2="123" y2="69" stroke="#FBBF24" stroke-width="3.8" stroke-linecap="round"/>
  <!-- LUMI text -->
  <text x="96" y="156" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="500" letter-spacing="6" fill="#F8FAFC">LUMI</text>
</svg>
