<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Sun icon mark - rising sun with rays -->
  <g transform="translate(10, 12)">
    <!-- Horizon line -->
    <line x1="0" y1="28" x2="36" y2="28" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Sun arc above horizon -->
    <path d="M 6 28 A 12 12 0 0 1 30 28" fill="url(#sunGrad)"/>
    <!-- Top ray -->
    <line x1="18" y1="3" x2="18" y2="9" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
    <!-- Top-left ray -->
    <line x1="8" y1="7" x2="11" y2="12" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Top-right ray -->
    <line x1="28" y1="7" x2="25" y2="12" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- LUMI wordmark -->
  <text x="56" y="36" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="700" letter-spacing="4" fill="url(#textGrad)">LUMI</text>

  <!-- Part of StayOS subtitle -->
  <text x="56" y="52" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="500" letter-spacing="1.5" fill="#9c7cff">Part of StayOS</text>
</svg>
