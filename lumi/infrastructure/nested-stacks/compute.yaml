AWSTemplateFormatVersion: "2010-09-09"
Description: >
  StayOS Compute Stack - Lambda functions (API, Orchestrator, Seed Data),
  IAM execution roles, Lambda layer, REST API Gateway with Cognito authorizer,
  EventBridge Scheduler, observability (CloudWatch logs, alarms, dashboard,
  X-Ray sampling), and seed data custom resource.

# -------------------------------------------------------------------
# Parameters
# -------------------------------------------------------------------
Parameters:
  StackPrefix:
    Type: String
    Default: lumi
    Description: Prefix for all resource names (propagated from root stack)

  AccountId:
    Type: String
    Description: AWS account ID for ARN construction

  BriefsTableName:
    Type: String
    Description: DynamoDB briefs table name (from data stack)

  BriefsTableArn:
    Type: String
    Description: DynamoDB briefs table ARN (for IAM policies)

  SettingsTableName:
    Type: String
    Description: DynamoDB settings table name (from data stack)

  SettingsTableArn:
    Type: String
    Description: DynamoDB settings table ARN (for IAM policies)

  AudioBucketName:
    Type: String
    Description: S3 bucket name for audio files (from storage stack)

  AudioDistributionDomain:
    Type: String
    Description: CloudFront domain for audio distribution (from storage stack)

  FrontendDistributionDomain:
    Type: String
    Description: CloudFront domain for frontend (used in CORS allowed origins)

  UserPoolId:
    Type: String
    Description: Cognito User Pool ID (from auth stack)

  UserPoolArn:
    Type: String
    Description: Cognito User Pool ARN (for API Gateway authorizer)

  UserPoolClientId:
    Type: String
    Description: Cognito App Client ID (from auth stack)

  DeployBucket:
    Type: String
    Description: S3 bucket for Lambda deployment artifacts (layer zip, function zips)

  DependenciesLayerS3Key:
    Type: String
    Description: Build-input-fingerprinted S3 key for the Python 3.12 x86_64 layer

  BedrockModelId:
    Type: String
    Default: "us.anthropic.claude-sonnet-4-6"
    Description: Bedrock foundation model ID for brief generation

  SpogApiEndpoint:
    Type: String
    Default: "https://spog-api.aloha.example.com"
    Description: SPOG API base URL for operational data

  MdpApiEndpoint:
    Type: String
    Default: "https://mdp-api.aloha.example.com"
    Description: MDP API base URL for market data

  SpogSecretArn:
    Type: String
    Description: Secrets Manager ARN for SPOG API key

  MdpSecretArn:
    Type: String
    Description: Secrets Manager ARN for MDP API key

  AppPassword:
    Type: String
    Description: Password for seed GM accounts (passed from root stack)
    NoEcho: true

  ReservationsTableName:
    Type: String
    Description: DynamoDB reservations table name (from dataset stack)

  ReservationsTableArn:
    Type: String
    Description: DynamoDB reservations table ARN (for IAM policies)

  RoomsTableName:
    Type: String
    Description: DynamoDB rooms table name (from dataset stack)

  RoomsTableArn:
    Type: String
    Description: DynamoDB rooms table ARN (for IAM policies)

  GuestsTableName:
    Type: String
    Description: DynamoDB guests table name (from dataset stack)

  GuestsTableArn:
    Type: String
    Description: DynamoDB guests table ARN (for IAM policies)

  RevenuesTableName:
    Type: String
    Description: DynamoDB revenues table name (from dataset stack)

  RevenuesTableArn:
    Type: String
    Description: DynamoDB revenues table ARN (for IAM policies)

  WorkOrdersTableName:
    Type: String
    Description: DynamoDB work orders table name (from dataset stack)

  WorkOrdersTableArn:
    Type: String
    Description: DynamoDB work orders table ARN (for IAM policies)

  XRaySamplingRate:
    Type: Number
    Default: 1.0
    Description: >
      X-Ray sampling fixed rate (0.0 to 1.0). Set to 1.0 for pilot (100%),
      reduce to 0.1 at go-live for cost optimization.

# -------------------------------------------------------------------
# Resources
# -------------------------------------------------------------------
Resources:

  # ================================================================= OBSERVABILITY =================================================================

  # -----------------------------------------------------------------
  # Unified CloudWatch Log Group
  # All Lambda functions and API Gateway access logs write here.
  # Enables cross-service correlation with a single Log Insights query.
  # Each source is distinguished by the "service" field in structured JSON.
  # -----------------------------------------------------------------
  UnifiedLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /stayos/application
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: StayOS
        - Key: resilience-tier
          Value: standard
        - Key: Component
          Value: observability

  # -----------------------------------------------------------------
  # API Gateway CloudWatch Role
  # Account-level role granting API Gateway permission to write logs.
  # Required for AccessLogSetting on API stages. One-time per region.
  # -----------------------------------------------------------------
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StackPrefix}-apigw-cloudwatch-role-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs"
      Tags:
        - Key: Project
          Value: StayOS
        - Key: resilience-tier
          Value: standard
        - Key: Component
          Value: observability

  # -----------------------------------------------------------------
  # API Gateway Account
  # Sets the account-level CloudWatch role for all API Gateway APIs.
  # This enables access logging and execution logging across stages.
  # -----------------------------------------------------------------
  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  # -----------------------------------------------------------------
  # X-Ray Sampling Rule
  # 100% sampling for pilot (20 GMs, low traffic). Parameterized via
  # XRaySamplingRate for reduction at scale. ServiceName pattern matches
  # all stayos-* services captured by Powertools Tracer.
  # -----------------------------------------------------------------
  XRaySamplingRule:
    Type: AWS::XRay::SamplingRule
    Properties:
      SamplingRule:
        RuleName: !Sub "${StackPrefix}-all-requests"
        Priority: 1000
        FixedRate: !Ref XRaySamplingRate
        ReservoirSize: 10
        ServiceName: "stayos-*"
        ServiceType: "*"
        Host: "*"
        HTTPMethod: "*"
        URLPath: "*"
        ResourceARN: "*"
        Version: 1

  # -----------------------------------------------------------------
  # CloudWatch Alarms
  # Alert on operational issues requiring immediate attention.
  # -----------------------------------------------------------------

  # Fires when orchestrator Lambda errors exceed 3 in 15 minutes.
  # Indicates brief generation failures affecting GM experience.
  OrchestratorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StackPrefix}-orchestrator-errors-high"
      AlarmDescription: Orchestrator Lambda errors exceeding threshold - brief generation may be failing
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub "${StackPrefix}-orchestrator"
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # Fires when API Gateway returns more than 5 server errors in 5 minutes.
  # Indicates API availability issues affecting GM app experience.
  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${StackPrefix}-api-5xx-high"
      AlarmDescription: API Gateway 5XX errors exceeding threshold - API may be unhealthy
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub "${StackPrefix}-api-gateway"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # -----------------------------------------------------------------
  # Log Insights Query Definitions
  # Pre-built queries scoped to the unified log group for common
  # troubleshooting and performance analysis scenarios.
  # -----------------------------------------------------------------

  # Query 1: All errors in the last hour (sorted by most recent)
  AllErrorsQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub "${StackPrefix}/all-errors"
      LogGroupNames:
        - /stayos/application
      QueryString: |
        fields @timestamp, service, level, message, xray_trace_id
        | filter level = "ERROR"
        | sort @timestamp desc
        | limit 100

  # Query 2: Trace a single request across all services
  TraceRequestQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub "${StackPrefix}/trace-request"
      LogGroupNames:
        - /stayos/application
      QueryString: |
        fields @timestamp, service, level, message
        | filter xray_trace_id = "<TRACE_ID>"
        | sort @timestamp asc

  # Query 3: Brief generation latency statistics (avg, p95, p99)
  BriefLatencyQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub "${StackPrefix}/brief-generation-latency"
      LogGroupNames:
        - /stayos/application
      QueryString: |
        fields @timestamp, property_id, duration_ms
        | filter service = "stayos-orchestrator" and message = "Brief generation pipeline complete"
        | stats avg(duration_ms) as avg_ms, pct(duration_ms, 95) as p95_ms, pct(duration_ms, 99) as p99_ms by bin(1h)

  # Query 4: API latency by endpoint path
  ApiLatencyQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub "${StackPrefix}/api-latency-by-endpoint"
      LogGroupNames:
        - /stayos/application
      QueryString: |
        fields @timestamp, resourcePath, responseLatency
        | filter service = "api-gateway"
        | stats avg(responseLatency) as avg_ms, pct(responseLatency, 50) as p50_ms, pct(responseLatency, 95) as p95_ms, pct(responseLatency, 99) as p99_ms by resourcePath

  # Query 5: Failed authentication attempts (401 responses)
  FailedAuthQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub "${StackPrefix}/failed-auth-attempts"
      LogGroupNames:
        - /stayos/application
      QueryString: |
        fields @timestamp, ip, resourcePath, gmAlias
        | filter service = "api-gateway" and status = "401"
        | sort @timestamp desc
        | limit 50

  # -----------------------------------------------------------------
  # CloudWatch Dashboard
  # Single-pane overview of LUMI system health with Lambda metrics,
  # API Gateway metrics, X-Ray trace data, and recent error logs.
  # -----------------------------------------------------------------
  OverviewDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${StackPrefix}-overview"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Invocations",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${StackPrefix}-api"],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${StackPrefix}-orchestrator"],
                  ["AWS/Lambda", "Invocations", "FunctionName", "${StackPrefix}-tools"]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Errors",
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${StackPrefix}-api"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${StackPrefix}-orchestrator"],
                  ["AWS/Lambda", "Errors", "FunctionName", "${StackPrefix}-tools"]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Duration (p95)",
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${StackPrefix}-api"],
                  ["AWS/Lambda", "Duration", "FunctionName", "${StackPrefix}-orchestrator"],
                  ["AWS/Lambda", "Duration", "FunctionName", "${StackPrefix}-tools"]
                ],
                "period": 300,
                "stat": "p95",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "API Gateway Latency and Errors",
                "metrics": [
                  ["AWS/ApiGateway", "Latency", "ApiName", "${StackPrefix}-api-gateway"],
                  ["AWS/ApiGateway", "5XXError", "ApiName", "${StackPrefix}-api-gateway"],
                  ["AWS/ApiGateway", "4XXError", "ApiName", "${StackPrefix}-api-gateway"]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "X-Ray Response Time (p50/p95/p99)",
                "metrics": [
                  ["AWS/X-Ray", "ResponseTime", "GroupName", "Default"],
                  ["AWS/X-Ray", "ResponseTime", "GroupName", "Default"]
                ],
                "period": 300,
                "stat": "p50",
                "region": "${AWS::Region}",
                "view": "timeSeries"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "X-Ray Faults + Errors",
                "metrics": [
                  ["AWS/X-Ray", "FaultRate", "GroupName", "Default"],
                  ["AWS/X-Ray", "ErrorRate", "GroupName", "Default"]
                ],
                "period": 300,
                "stat": "Average",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "log",
              "x": 0, "y": 18, "width": 24, "height": 6,
              "properties": {
                "title": "Recent Errors (Log Insights)",
                "query": "SOURCE '/stayos/application' | fields @timestamp, service, message | filter level = \"ERROR\" | sort @timestamp desc | limit 20",
                "region": "${AWS::Region}",
                "stacked": false,
                "view": "table"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 24, "width": 12, "height": 6,
              "properties": {
                "title": "Gateway WAF Activity",
                "metrics": [
                  ["AWS/Bedrock-AgentCore", "WafBlocks"],
                  ["AWS/Bedrock-AgentCore", "WafFailCloses"]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "log",
              "x": 12, "y": 24, "width": 12, "height": 6,
              "properties": {
                "title": "Recent Chat Agent Errors",
                "query": "SOURCE '/stayos/agentcore/chat-agent' | fields @timestamp, message, connection_id, property_id, error_type | filter level = \"ERROR\" | sort @timestamp desc | limit 20",
                "region": "${AWS::Region}",
                "stacked": false,
                "view": "table"
              }
            }
          ]
        }

  # =================================================================
  # DEPENDENCY LAYER BUILD
  # =================================================================

  # Build the shared dependency layer inside the existing ComputeStack so the
  # deployment does not create another top-level or nested CloudFormation
  # stack. The custom resource waits for CodeBuild before the immutable Lambda
  # layer version is created.
  DependencyLayerBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DependencyLayerArtifacts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub "arn:aws:s3:::${DeployBucket}/layer-source/*"
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${DeployBucket}/layers/*"
              - Effect: Allow
                Action: s3:GetBucketLocation
                Resource: !Sub "arn:aws:s3:::${DeployBucket}"
        - PolicyName: DependencyLayerBuildLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AccountId}:log-group:/aws/codebuild/${StackPrefix}-dependencies-build:*"
      Tags:
        - Key: Project
          Value: StayOS
        - Key: resilience-tier
          Value: standard
        - Key: Component
          Value: compute

  DependencyLayerBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${StackPrefix}-dependencies-build"
      Description: Builds the LUMI Python 3.12 x86_64 Lambda dependency layer
      ServiceRole: !GetAtt DependencyLayerBuildRole.Arn
      Environment:
        Type: LINUX_LAMBDA_CONTAINER
        ComputeType: BUILD_LAMBDA_2GB
        Image: aws/codebuild/amazonlinux-x86_64-lambda-standard:python3.12
        EnvironmentVariables:
          - Name: DEPLOY_BUCKET
            Value: !Ref DeployBucket
          - Name: LAYER_S3_KEY
            Value: !Ref DependenciesLayerS3Key
      Source:
        Type: S3
        Location: !Sub "${DeployBucket}/layer-source/dependencies-layer-source.zip"
        BuildSpec: buildspec.yml
      Artifacts:
        Type: NO_ARTIFACTS
      Tags:
        - Key: Project
          Value: StayOS
        - Key: resilience-tier
          Value: standard
        - Key: Component
          Value: compute

  DependencyLayerBuildProviderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartDependencyLayerBuild
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: codebuild:StartBuild
                Resource: !GetAtt DependencyLayerBuildProject.Arn
              - Effect: Allow
                Action: codebuild:BatchGetBuilds
                Resource: "*"
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${DeployBucket}/layers/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${DeployBucket}"
                Condition:
                  StringLike:
                    s3:prefix: "layers/*"
        - PolicyName: DependencyLayerProviderLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AccountId}:log-group:/aws/lambda/${StackPrefix}-dependency-layer-build-provider:*"
      Tags:
        - Key: Project
          Value: StayOS
        - Key: resilience-tier
          Value: standard
        - Key: Component
          Value: compute

  DependencyLayerBuildProvider:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${StackPrefix}-dependency-layer-build-provider"
      Description: Waits for the ComputeStack-owned dependency layer CodeBuild
      Runtime: python3.12
      Handler: index.handler
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 840
      Role: !GetAtt DependencyLayerBuildProviderRole.Arn
      Code:
        ZipFile: |
          import json
          import time
          import urllib.request

          import boto3
          from botocore.exceptions import ClientError

          codebuild = boto3.client("codebuild")
          s3 = boto3.client("s3")


          def send(event, context, status, reason, physical_id, data=None):
              body = json.dumps(
                  {
                      "Status": status,
                      "Reason": reason,
                      "PhysicalResourceId": physical_id,
                      "StackId": event["StackId"],
                      "RequestId": event["RequestId"],
                      "LogicalResourceId": event["LogicalResourceId"],
                      "NoEcho": False,
                      "Data": data or {},
                  }
              ).encode("utf-8")
              request = urllib.request.Request(
                  event["ResponseURL"],
                  data=body,
                  method="PUT",
                  headers={
                      "content-type": "",
                      "content-length": str(len(body)),
                  },
              )
              with urllib.request.urlopen(request) as response:
                  response.read()


          def object_exists(bucket, key):
              try:
                  s3.head_object(Bucket=bucket, Key=key)
                  return True
              except ClientError as error:
                  code = error.response.get("Error", {}).get("Code", "")
                  if code in {"404", "NoSuchKey", "NotFound"}:
                      return False
                  raise


          def handler(event, context):
              properties = event.get("ResourceProperties", {})
              project = properties.get("ProjectName", "dependency-layer-build")
              physical_id = event.get("PhysicalResourceId") or project
              try:
                  if event["RequestType"] == "Delete":
                      send(
                          event,
                          context,
                          "SUCCESS",
                          "Dependency layer build has no delete action.",
                          physical_id,
                      )
                      return

                  bucket = properties["DeployBucket"]
                  layer_key = properties["LayerS3Key"]
                  if not object_exists(bucket, layer_key):
                      build = codebuild.start_build(
                          projectName=project,
                          environmentVariablesOverride=[
                              {
                                  "name": "LAYER_S3_KEY",
                                  "value": layer_key,
                                  "type": "PLAINTEXT",
                              }
                          ],
                      )
                      build_id = build["build"]["id"]
                      while True:
                          if context.get_remaining_time_in_millis() < 15000:
                              raise TimeoutError(
                                  "Dependency layer build exceeded provider timeout."
                              )
                          current = codebuild.batch_get_builds(ids=[build_id])[
                              "builds"
                          ][0]
                          build_status = current["buildStatus"]
                          if build_status == "SUCCEEDED":
                              break
                          if build_status not in {"IN_PROGRESS", "QUEUED"}:
                              log_url = current.get("logs", {}).get("deepLink", "")
                              raise RuntimeError(
                                  f"CodeBuild ended in {build_status}. {log_url}"
                              )
                          time.sleep(5)

                  if not object_exists(bucket, layer_key):
                      raise RuntimeError(
                          f"Dependency layer artifact was not written: {layer_key}"
                      )
                  send(
                      event,
                      context,
                      "SUCCESS",
                      "Dependency layer artifact is ready.",
                      physical_id,
                      {"LayerS3Key": layer_key},
                  )
              except Exception as error:
                  send(
                      event,
                      context,
                      "FAILED",
                      str(error)[:1000],
                      physical_id,
                  )

      Tags:
        - Key: Project
          Value: StayOS
        - Key: resilience-tier
          Value: standard
        - Key: Component
          Value: compute

  DependencyLayerBuild:
    Type: Custom::DependencyLayerBuild
    Properties:
      ServiceToken: !GetAtt DependencyLayerBuildProvider.Arn
      ServiceTimeout: 900
      ProjectName: !Ref DependencyLayerBuildProject
      DeployBucket: !Ref DeployBucket
      LayerS3Key: !Ref DependenciesLayerS3Key

  # =================================================================
  # LAMBDA LAYER
  # =================================================================

  # -----------------------------------------------------------------
  # Lambda Layer: Shared Dependencies
  # Packages common Python dependencies (boto3, powertools, requests,
  # pyjwt) to avoid bundling them in each function zip. Pinned boto3
  # version avoids runtime version drift per PYQUALITY-06.
  # Layer zip is uploaded to the deploy bucket during the build step.
  # -----------------------------------------------------------------
  DependenciesLayer:
    Type: AWS::Lambda::LayerVersion
    DependsOn: DependencyLayerBuild
    Properties:
      LayerName: !Sub "${StackPrefix}-dependencies"
      Description: Shared Python dependencies for LUMI Lambda functions
      CompatibleRuntimes:
        - python3.12
      CompatibleArchitectures:
        - x86_64
      Content:
        S3Bucket: !Ref DeployBucket
        S3Key: !Ref DependenciesLayerS3Key

  # =================================================================
  # IAM ROLES
  # =================================================================

  # -----------------------------------------------------------------
  # IAM Role: API Lambda
  # Least-privilege role for the REST API handler. Allows:
  # - DynamoDB read on briefs table (GetItem, Query for brief retrieval)
  # - DynamoDB read/write on settings table (GetItem, PutItem for settings CRUD)
  # - CloudWatch Logs for operational logging
  # - X-Ray for distributed tracing
  # Region suffix in role name ensures uniqueness in multi-region deployments.
  # -----------------------------------------------------------------
  ApiLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StackPrefix}-api-role-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Read briefs by propertyId (partition key) and briefDate (sort key)
              - Effect: Allow
                Action:
                  - "dynamodb:GetItem"
                  - "dynamodb:Query"
                Resource: !Ref BriefsTableArn
              # Read and update GM settings by gmAlias (partition key)
              - Effect: Allow
                Action:
                  - "dynamodb:GetItem"
                  - "dynamodb:PutItem"
                Resource: !Ref SettingsTableArn
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AccountId}:log-group:/aws/lambda/${StackPrefix}-*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AccountId}:log-group:/stayos/application:*"
        - PolicyName: XRayTracing
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "xray:PutTraceSegments"
                  - "xray:PutTelemetryRecords"
                Resource: "*"
        # Per-GM schedule management (REQ-SCHED-7): create/update schedules
        # when a GM changes their briefDeliveryTime via the Settings API.
        # Scoped to stayos-brief-* schedule names within the stayos-briefs group.
        - PolicyName: SchedulerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "scheduler:CreateSchedule"
                  - "scheduler:UpdateSchedule"
                  - "scheduler:GetSchedule"
                Resource:
                  - !Sub "arn:aws:scheduler:${AWS::Region}:${AccountId}:schedule/${StackPrefix}-briefs/${StackPrefix}-brief-*"
              # PassRole allows the API Lambda to assign the scheduler target role
              # when creating/updating schedules
              - Effect: Allow
                Action:
                  - "iam:PassRole"
                Resource: !GetAtt SchedulerTargetRole.Arn
                Condition:
                  StringEquals:
                    "iam:PassedToService": "scheduler.amazonaws.com"
      Tags:
        - Key: Project
          Value: StayOS
        - Key: resilience-tier
          Value: standard
        - Key: Component
          Value: compute

  # -----------------------------------------------------------------
  # IAM Role: Orchestrator Lambda
  # Broader permissions required for the daily brief generation pipeline:
  # - DynamoDB write on briefs (store generated brief metadata)
  # - DynamoDB read on settings (fetch GM preferences for personalization)
  # - S3 write on audio bucket (store Polly-generated MP3 files)
  # - Bedrock InvokeModel (AI summarization with Claude)
  # - Polly SynthesizeSpeech (text-to-speech audio generation)
  # - Secrets Manager read (API keys for SPOG and MDP external services)
  # - CloudWatch Logs and X-Ray for observability
  # -----------------------------------------------------------------
  OrchestratorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StackPrefix}-orchestrator-role-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Write generated brief metadata; Query for cached-brief fallback
              - Effect: Allow
                Action:
                  - "dynamodb:PutItem"
                  - "dynamodb:Query"
                Resource: !Ref BriefsTableArn
              # Read GM settings for personalization (language, thresholds, toggles).
              # Scan is needed because the table PK is gmAlias but lookup is by
              # propertyId. Acceptable at pilot scale (20 items). Plan: add a
              # propertyId-index GSI and switch to Query for production.
              - Effect: Allow
                Action:
                  - "dynamodb:GetItem"
                  - "dynamodb:Scan"
                Resource: !Ref SettingsTableArn
        - PolicyName: S3AudioWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Upload Polly-generated MP3 files under briefs/ prefix only
              - Effect: Allow
                Action:
                  - "s3:PutObject"
                Resource: !Sub "arn:aws:s3:::${AudioBucketName}/briefs/*"
        - PolicyName: BedrockInvokeModel
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Invoke Bedrock foundation models and inference profiles for AI brief summarization.
              # Cross-region inference profiles route to models in multiple US regions,
              # so foundation-model resource must allow all regions (arn partition wildcard).
              - Effect: Allow
                Action:
                  - "bedrock:InvokeModel"
                Resource:
                  - "arn:aws:bedrock:*::foundation-model/*"
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AccountId}:inference-profile/*"
        - PolicyName: PollySynthesize
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Synthesize speech - Polly does not support resource-level permissions
              - Effect: Allow
                Action:
                  - "polly:SynthesizeSpeech"
                Resource: "*"
        - PolicyName: SecretsManagerRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Retrieve API keys for external SPOG and MDP services
              - Effect: Allow
                Action:
                  - "secretsmanager:GetSecretValue"
                Resource:
                  - !Ref SpogSecretArn
                  - !Ref MdpSecretArn
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AccountId}:log-group:/aws/lambda/${StackPrefix}-*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AccountId}:log-group:/stayos/application:*"
        - PolicyName: XRayTracing
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "xray:PutTraceSegments"
                  - "xray:PutTelemetryRecords"
                Resource: "*"
        # Read access to dataset tables for live data queries (REQ-DS-7)
        - PolicyName: DatasetTablesRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "dynamodb:Query"
                  - "dynamodb:GetItem"
                Resource:
                  - !Ref ReservationsTableArn
                  - !Sub "${ReservationsTableArn}/index/*"
                  - !Ref RoomsTableArn
                  - !Sub "${RoomsTableArn}/index/*"
                  - !Ref GuestsTableArn
                  - !Sub "${GuestsTableArn}/index/*"
                  - !Ref RevenuesTableArn
                  - !Ref WorkOrdersTableArn
                  - !Sub "${WorkOrdersTableArn}/index/*"
      Tags:
        - Key: Project
          Value: StayOS
        - Key: resilience-tier
          Value: standard
        - Key: Component
          Value: compute

  # -----------------------------------------------------------------
  # IAM Role: Seed Data Lambda
  # Used only during stack deployment to provision Cognito users and
  # seed DynamoDB settings. Minimal permissions scoped to:
  # - Cognito admin user management (create users, set passwords)
  # - DynamoDB write on settings table (initial default preferences)
  # - CloudWatch Logs for deployment troubleshooting
  # -----------------------------------------------------------------
  SeedDataLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StackPrefix}-seed-data-role-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: CognitoAdminAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Create demo GM users and set permanent passwords for pilot
              - Effect: Allow
                Action:
                  - "cognito-idp:AdminCreateUser"
                  - "cognito-idp:AdminSetUserPassword"
                Resource: !Ref UserPoolArn
        - PolicyName: DynamoDBWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Seed initial default settings for each GM
              - Effect: Allow
                Action:
                  - "dynamodb:PutItem"
                Resource: !Ref SettingsTableArn
        - PolicyName: DynamoDBBriefsWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Seed 7 days of historical brief records per GM (REQ-HIST-4)
              - Effect: Allow
                Action:
                  - "dynamodb:PutItem"
                Resource: !Ref BriefsTableArn
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AccountId}:log-group:/aws/lambda/${StackPrefix}-*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AccountId}:log-group:/stayos/application:*"
        # Per-GM schedule provisioning (REQ-SCHED-5): create initial schedules
        # for all 20 pilot GMs during stack deployment.
        - PolicyName: SchedulerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "scheduler:CreateSchedule"
                  - "scheduler:GetSchedule"
                Resource:
                  - !Sub "arn:aws:scheduler:${AWS::Region}:${AccountId}:schedule/${StackPrefix}-briefs/${StackPrefix}-brief-*"
              - Effect: Allow
                Action:
                  - "iam:PassRole"
                Resource: !GetAtt SchedulerTargetRole.Arn
                Condition:
                  StringEquals:
                    "iam:PassedToService": "scheduler.amazonaws.com"
        # Write access to dataset tables for seeding hotel operations data (REQ-DS-8)
        - PolicyName: DatasetTablesWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "dynamodb:BatchWriteItem"
                  - "dynamodb:PutItem"
                  - "dynamodb:UpdateItem"
                  - "dynamodb:Scan"
                Resource:
                  - !Ref ReservationsTableArn
                  - !Ref RoomsTableArn
                  - !Ref GuestsTableArn
                  - !Ref RevenuesTableArn
                  - !Ref WorkOrdersTableArn
      Tags:
        - Key: Project
          Value: StayOS
        - Key: resilience-tier
          Value: standard
        - Key: Component
          Value: compute

  # =================================================================
  # LAMBDA FUNCTIONS
  # =================================================================

  # -----------------------------------------------------------------
  # Lambda Function: API Handler
  # Single function handles all REST API routes via internal path-based
  # routing. This avoids cold-start multiplication from per-route Lambdas
  # while keeping the function focused and fast (256 MB, 10s timeout).
  # X-Ray active tracing enabled for end-to-end request visibility.
  # -----------------------------------------------------------------
  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${StackPrefix}-api"
      Description: REST API handler for brief retrieval and settings management
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Architectures:
        - x86_64
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt ApiLambdaRole.Arn
      Layers:
        - !Ref DependenciesLayer
      TracingConfig:
        Mode: Active
      LoggingConfig:
        LogGroup: !Ref UnifiedLogGroup
        LogFormat: JSON
      Code:
        S3Bucket: !Ref DeployBucket
        S3Key: functions/stayos-api.zip
      Environment:
        Variables:
          BRIEFS_TABLE_NAME: !Ref BriefsTableName
          SETTINGS_TABLE_NAME: !Ref SettingsTableName
          AUDIO_CLOUDFRONT_DOMAIN: !Ref AudioDistributionDomain
          COGNITO_USER_POOL_ID: !Ref UserPoolId
          FRONTEND_ORIGIN: !Sub "https://${FrontendDistributionDomain}"
          # Per-GM schedule management (REQ-SCHED-2)
          SCHEDULE_GROUP_NAME: !Sub "${StackPrefix}-briefs"
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerTargetRole.Arn
          ORCHESTRATOR_ARN: !GetAtt OrchestratorFunction.Arn
          STACK_PREFIX: !Ref StackPrefix
          LOG_LEVEL: INFO
      Tags:
        - Key: Project
          Value: StayOS
        - Key: resilience-tier
          Value: standard
        - Key: Component
          Value: compute

  # -----------------------------------------------------------------
  # Lambda Function: Orchestrator (Daily Brief Generation Pipeline)
  # Runs the full brief generation pipeline: pull SPOG/MDP data,
  # generate AI summary via Bedrock, synthesize audio via Polly,
  # store results in DynamoDB and S3. 512 MB and 120s timeout account
  # for multiple external API calls plus model inference.
  # Reserved concurrency of 10 rate-limits concurrent SPOG API calls
  # to avoid overwhelming the external service during parallel property runs.
  # -----------------------------------------------------------------
  OrchestratorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${StackPrefix}-orchestrator"
      Description: Daily brief generation pipeline - pulls data, generates AI summary, synthesizes audio
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 120
      # Rate-limit protection for external SPOG/MDP APIs
      ReservedConcurrentExecutions: 10
      Role: !GetAtt OrchestratorLambdaRole.Arn
      Layers:
        - !Ref DependenciesLayer
      TracingConfig:
        Mode: Active
      LoggingConfig:
        LogGroup: !Ref UnifiedLogGroup
        LogFormat: JSON
      Code:
        S3Bucket: !Ref DeployBucket
        S3Key: functions/stayos-orchestrator.zip
      Environment:
        Variables:
          BRIEFS_TABLE_NAME: !Ref BriefsTableName
          SETTINGS_TABLE_NAME: !Ref SettingsTableName
          AUDIO_BUCKET_NAME: !Ref AudioBucketName
          AUDIO_CLOUDFRONT_DOMAIN: !Ref AudioDistributionDomain
          SPOG_API_ENDPOINT: !Ref SpogApiEndpoint
          MDP_API_ENDPOINT: !Ref MdpApiEndpoint
          SPOG_SECRET_ARN: !Ref SpogSecretArn
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          MOCK_MODE: "true"
          # Dataset tables for live data queries (REQ-DS-7)
          RESERVATIONS_TABLE_NAME: !Ref ReservationsTableName
          ROOMS_TABLE_NAME: !Ref RoomsTableName
          GUESTS_TABLE_NAME: !Ref GuestsTableName
          REVENUES_TABLE_NAME: !Ref RevenuesTableName
          WORK_ORDERS_TABLE_NAME: !Ref WorkOrdersTableName
          LOG_LEVEL: INFO
      Tags:
        - Key: Project
          Value: StayOS
        - Key: resilience-tier
          Value: standard
        - Key: Component
          Value: compute

  # -----------------------------------------------------------------
  # Lambda Function: Seed Data (CloudFormation Custom Resource)
  # Runs only during stack deployment to provision 20 demo GM accounts
  # in Cognito, seed their default settings in DynamoDB, and populate
  # the 5 hotel dataset tables (~48K items). No X-Ray tracing needed -
  # runs once at deploy time, not in request path. 300s timeout allows
  # for bulk BatchWriteItem operations across all dataset tables.
  # -----------------------------------------------------------------
  SeedDataFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${StackPrefix}-seed-data"
      Description: CloudFormation custom resource - provisions Cognito users and seeds DynamoDB settings
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 300
      Role: !GetAtt SeedDataLambdaRole.Arn
      Layers:
        - !Ref DependenciesLayer
      LoggingConfig:
        LogGroup: !Ref UnifiedLogGroup
        LogFormat: JSON
      Code:
        S3Bucket: !Ref DeployBucket
        S3Key: functions/stayos-seed-data.zip
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref UserPoolId
          COGNITO_CLIENT_ID: !Ref UserPoolClientId
          SETTINGS_TABLE_NAME: !Ref SettingsTableName
          # Historical brief seeding (REQ-HIST-6): write 7 days of brief records
          BRIEFS_TABLE_NAME: !Ref BriefsTableName
          DEMO_PASSWORD: !Ref AppPassword
          # Per-GM schedule provisioning (REQ-SCHED-5)
          SCHEDULE_GROUP_NAME: !Sub "${StackPrefix}-briefs"
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerTargetRole.Arn
          ORCHESTRATOR_ARN: !GetAtt OrchestratorFunction.Arn
          STACK_PREFIX: !Ref StackPrefix
          # Dataset tables for hotel operations seeding (REQ-DS-8)
          RESERVATIONS_TABLE_NAME: !Ref ReservationsTableName
          ROOMS_TABLE_NAME: !Ref RoomsTableName
          GUESTS_TABLE_NAME: !Ref GuestsTableName
          REVENUES_TABLE_NAME: !Ref RevenuesTableName
          WORK_ORDERS_TABLE_NAME: !Ref WorkOrdersTableName
          LOG_LEVEL: INFO
      Tags:
        - Key: Project
          Value: StayOS
        - Key: resilience-tier
          Value: standard
        - Key: Component
          Value: compute

  # -----------------------------------------------------------------
  # Custom Resource: Seed Data Trigger
  # Invokes the SeedDataFunction during stack Create/Update events.
  # Change the Trigger property value to force re-seeding on stack update.
  # On Delete events, the function is a no-op (keeps data intact).
  # -----------------------------------------------------------------
  SeedDataCustomResource:
    Type: Custom::SeedData
    # DependsOn not needed - implicit via !GetAtt SeedDataFunction.Arn in ServiceToken
    Properties:
      ServiceToken: !GetAtt SeedDataFunction.Arn
      # Change this value to re-trigger seeding on stack update
      Trigger: "v6-hotel-dataset-seeder"

  # =================================================================
  # API GATEWAY
  # =================================================================

  # -----------------------------------------------------------------
  # REST API Gateway
  # Regional endpoint (not edge-optimized) since users are concentrated
  # in known regions and CloudFront handles edge caching for the frontend.
  # REGIONAL avoids unnecessary CloudFront distribution created by EDGE type.
  # -----------------------------------------------------------------
  ApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${StackPrefix}-api-gateway"
      Description: LUMI REST API - brief retrieval and settings management
      EndpointConfiguration:
        Types:
          - REGIONAL
      Tags:
        - Key: Project
          Value: StayOS
        - Key: resilience-tier
          Value: standard
        - Key: Component
          Value: compute

  # -----------------------------------------------------------------
  # Cognito Authorizer
  # Uses API Gateway's built-in Cognito User Pool authorizer for JWT
  # validation. This eliminates the need for a custom Lambda authorizer,
  # reducing latency and cold starts. Validates the Authorization header
  # bearer token against the Cognito User Pool.
  # -----------------------------------------------------------------
  CognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub "${StackPrefix}-cognito-authorizer"
      Type: COGNITO_USER_POOLS
      RestApiId: !Ref ApiGateway
      ProviderARNs:
        - !Ref UserPoolArn
      IdentitySource: method.request.header.Authorization

  # -----------------------------------------------------------------
  # API Resources: URL path hierarchy
  # /briefs/{propertyId} - GET latest brief for a property (stage provides /v1 prefix)
  # /settings/{gmAlias}  - GET/PUT GM preferences
  # -----------------------------------------------------------------

  # /briefs
  ApiResourceBriefs:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: briefs

  # /v1/briefs/history
  ApiResourceBriefsHistory:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !Ref ApiResourceBriefs
      PathPart: history

  # /v1/briefs/{propertyId}
  ApiResourceBriefsPropertyId:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !Ref ApiResourceBriefs
      PathPart: "{propertyId}"

  # /v1/briefs/{propertyId}/{briefDate}
  ApiResourceBriefsPropertyIdDate:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !Ref ApiResourceBriefsPropertyId
      PathPart: "{briefDate}"

  # /settings
  ApiResourceSettings:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !GetAtt ApiGateway.RootResourceId
      PathPart: settings

  # /v1/settings/{gmAlias}
  ApiResourceSettingsGmAlias:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGateway
      ParentId: !Ref ApiResourceSettings
      PathPart: "{gmAlias}"

  # -----------------------------------------------------------------
  # Methods: GET /v1/briefs/{propertyId}
  # Retrieves the latest generated brief for a given property.
  # Protected by Cognito authorizer - requires valid JWT in header.
  # Lambda proxy integration passes full request context to handler.
  # -----------------------------------------------------------------
  BriefsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ApiResourceBriefsPropertyId
      HttpMethod: GET
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations"

  # -----------------------------------------------------------------
  # Methods: OPTIONS /v1/briefs/{propertyId} (CORS Preflight)
  # MOCK integration returns CORS headers without invoking Lambda.
  # Allowed origin restricted to the frontend CloudFront domain.
  # -----------------------------------------------------------------
  BriefsOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ApiResourceBriefsPropertyId
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationHttpMethod: POST
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: !Sub "'https://${FrontendDistributionDomain}'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # -----------------------------------------------------------------
  # Methods: GET /v1/briefs/{propertyId}/{briefDate}
  # Retrieves a specific dated brief for a property.
  # Protected by Cognito authorizer - requires valid JWT in header.
  # Lambda proxy integration passes full request context to handler.
  # -----------------------------------------------------------------
  BriefsByDateGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ApiResourceBriefsPropertyIdDate
      HttpMethod: GET
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations"

  # -----------------------------------------------------------------
  # Methods: OPTIONS /v1/briefs/{propertyId}/{briefDate} (CORS Preflight)
  # MOCK integration returns CORS headers without invoking Lambda.
  # -----------------------------------------------------------------
  BriefsByDateOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ApiResourceBriefsPropertyIdDate
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationHttpMethod: POST
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: !Sub "'https://${FrontendDistributionDomain}'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # -----------------------------------------------------------------
  # Methods: GET /v1/briefs/history
  # Retrieves 7-day historical brief summaries for the authenticated GM's
  # property. Protected by Cognito authorizer - propertyId from JWT claims.
  # -----------------------------------------------------------------
  BriefsHistoryGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ApiResourceBriefsHistory
      HttpMethod: GET
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations"

  # -----------------------------------------------------------------
  # Methods: OPTIONS /v1/briefs/history (CORS Preflight)
  # MOCK integration returns CORS headers without invoking Lambda.
  # -----------------------------------------------------------------
  BriefsHistoryOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ApiResourceBriefsHistory
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationHttpMethod: POST
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: !Sub "'https://${FrontendDistributionDomain}'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # -----------------------------------------------------------------
  # Methods: GET /v1/settings/{gmAlias}
  # Retrieves GM settings (delivery time, alert toggles, thresholds).
  # Protected by Cognito authorizer.
  # -----------------------------------------------------------------
  SettingsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ApiResourceSettingsGmAlias
      HttpMethod: GET
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations"

  # -----------------------------------------------------------------
  # Methods: PUT /v1/settings/{gmAlias}
  # Updates GM settings (delivery time, alert toggles, thresholds).
  # Protected by Cognito authorizer. Input validation handled in Lambda.
  # -----------------------------------------------------------------
  SettingsPutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ApiResourceSettingsGmAlias
      HttpMethod: PUT
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiFunction.Arn}/invocations"

  # -----------------------------------------------------------------
  # Methods: OPTIONS /v1/settings/{gmAlias} (CORS Preflight)
  # Includes GET, PUT, OPTIONS in allowed methods for settings endpoints.
  # -----------------------------------------------------------------
  SettingsOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref ApiResourceSettingsGmAlias
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationHttpMethod: POST
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: "200"
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
              method.response.header.Access-Control-Allow-Methods: "'GET,PUT,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: !Sub "'https://${FrontendDistributionDomain}'"
      MethodResponses:
        - StatusCode: "200"
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # -----------------------------------------------------------------
  # Gateway Response: DEFAULT_4XX
  # Adds CORS headers to all 4XX responses generated by API Gateway
  # itself (authorizer failures, throttling, missing routes). Without
  # this, the browser blocks these responses as CORS errors and the
  # frontend cannot distinguish 401 from network failure.
  # -----------------------------------------------------------------
  GatewayResponse4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ApiGateway
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'https://${FrontendDistributionDomain}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Authorization,Content-Type'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,PUT,OPTIONS'"

  # -----------------------------------------------------------------
  # API Deployment
  # Creates an immutable deployment snapshot of the API configuration.
  # DependsOn ensures all methods are created before deployment.
  # -----------------------------------------------------------------
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - BriefsGetMethod
      - BriefsOptionsMethod
      - BriefsByDateGetMethod
      - BriefsByDateOptionsMethod
      - BriefsHistoryGetMethod
      - BriefsHistoryOptionsMethod
      - SettingsGetMethod
      - SettingsPutMethod
      - SettingsOptionsMethod
      - GatewayResponse4XX
    Properties:
      RestApiId: !Ref ApiGateway

  # -----------------------------------------------------------------
  # API Stage: v1
  # Stage-level throttling: 100 burst, 50 steady-state requests/second.
  # These limits protect the backend Lambda from traffic spikes during
  # the pilot phase. Can be increased as usage patterns stabilize.
  # -----------------------------------------------------------------
  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: v1
      RestApiId: !Ref ApiGateway
      DeploymentId: !Ref ApiDeployment
      Description: LUMI API v1 stage
      TracingEnabled: true
      AccessLogSetting:
        DestinationArn: !GetAtt UnifiedLogGroup.Arn
        Format: '{"service":"api-gateway","requestId":"$context.requestId","ip":"$context.identity.sourceIp","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","responseLength":"$context.responseLength","requestTime":"$context.requestTime","xrayTraceId":"$context.xrayTraceId","gmAlias":"$context.authorizer.claims.custom:gmAlias","integrationLatency":"$context.integrationLatency","responseLatency":"$context.responseLatency"}'
      MethodSettings:
        - HttpMethod: "*"
          ResourcePath: "/*"
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50
      Tags:
        - Key: Project
          Value: StayOS
        - Key: resilience-tier
          Value: standard
        - Key: Component
          Value: compute

  # -----------------------------------------------------------------
  # Lambda Permission: API Gateway -> API Function
  # Grants API Gateway permission to invoke the API Lambda function.
  # SourceArn uses wildcard to cover all methods/resources/stages.
  # -----------------------------------------------------------------
  ApiLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: "lambda:InvokeFunction"
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AccountId}:${ApiGateway}/*"

  # =================================================================
  # EVENTBRIDGE SCHEDULER (Per-GM Schedules)
  # Individual schedules per GM fire at their configured local delivery
  # time using EventBridge Scheduler's native timezone support.
  # Schedules are managed by the API Lambda (on settings change) and
  # the Seed Data Lambda (on initial provisioning).
  # Satisfies REQ-SCHED-1, REQ-SCHED-6, REQ-SCHED-8.
  # =================================================================

  # -----------------------------------------------------------------
  # Schedule Group: Organizational container for all per-GM schedules.
  # Provides bulk visibility in the console and enables group-level
  # operations (list all brief schedules, delete group on teardown).
  # -----------------------------------------------------------------
  BriefScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: !Sub "${StackPrefix}-briefs"
      Tags:
        - Key: Project
          Value: StayOS
        - Key: resilience-tier
          Value: standard

  # -----------------------------------------------------------------
  # IAM Role: EventBridge Scheduler Target Role
  # Assumed by EventBridge Scheduler when invoking the orchestrator Lambda.
  # Scoped to only allow lambda:InvokeFunction on the orchestrator.
  # SourceAccount condition prevents confused deputy attacks.
  # -----------------------------------------------------------------
  SchedulerTargetRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${StackPrefix}-scheduler-role-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AccountId
      Policies:
        - PolicyName: InvokeOrchestrator
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "lambda:InvokeFunction"
                Resource: !GetAtt OrchestratorFunction.Arn
      Tags:
        - Key: Project
          Value: StayOS
        - Key: resilience-tier
          Value: standard
        - Key: Component
          Value: compute

  # -----------------------------------------------------------------
  # Lambda Permission: EventBridge Scheduler -> Orchestrator
  # Grants EventBridge Scheduler service permission to invoke the
  # orchestrator Lambda function for per-GM scheduled invocations.
  # -----------------------------------------------------------------
  SchedulerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: "lambda:InvokeFunction"
      FunctionName: !Ref OrchestratorFunction
      Principal: scheduler.amazonaws.com
      SourceAccount: !Ref AccountId

# -------------------------------------------------------------------
# Outputs
# Exported for use by other nested stacks and root stack.
# -------------------------------------------------------------------
Outputs:
  ApiGatewayUrl:
    Description: API Gateway base URL
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/v1"

  ApiId:
    Description: API Gateway REST API ID
    Value: !Ref ApiGateway

  ApiFunctionArn:
    Description: ARN of the API Lambda function
    Value: !GetAtt ApiFunction.Arn

  DependenciesLayerArn:
    Description: ARN of the shared Lambda dependencies layer (boto3, Powertools) for reuse by other nested stacks
    Value: !Ref DependenciesLayer

  OrchestratorFunctionArn:
    Description: ARN of the orchestrator Lambda function
    Value: !GetAtt OrchestratorFunction.Arn

  SchedulerTargetRoleArn:
    Description: ARN of the IAM role used by EventBridge Scheduler to invoke orchestrator
    Value: !GetAtt SchedulerTargetRole.Arn

  BriefScheduleGroupName:
    Description: EventBridge Scheduler group containing per-GM brief schedules
    Value: !Ref BriefScheduleGroup

  UnifiedLogGroupName:
    Description: Name of the unified application log group
    Value: !Ref UnifiedLogGroup

  DashboardName:
    Description: CloudWatch dashboard name
    Value: !Sub "${StackPrefix}-overview"
