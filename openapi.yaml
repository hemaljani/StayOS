openapi: "3.0.3"
info:
  title: StayOS API
  version: "1.2.0"
  description: |
    StayOS is the shared intelligence platform for hotel General Managers and
    associates. This authoritative REST contract documents its two separately
    branded experiences: LUMI provides daily intelligence briefs and General
    Manager settings, while PULSE provides real-time operational alerts,
    closed-loop actions, delivery configuration, and operations views.

    All endpoints require Amazon Cognito JWT Bearer authentication and are
    protected by AWS WAF with a US-only geographic restriction. Every route is
    scoped server-side to the caller's associated properties; no route trusts
    client-supplied scope. LUMI and PULSE use distinct deployed API Gateway IDs
    at the same `/v1` stage, represented by brand-specific server entries and
    path-level server selection.

    The PULSE foreground realtime feed is delivered over a separate AWS
    AppSync Events WebSocket channel and is not part of this REST contract. Use
    `GET /config/realtime` to obtain its endpoint and namespace.

externalDocs:
  description: StayOS platform overview, architecture, build, and deployment guide
  url: README.md

servers:
  - url: https://{lumi-api-id}.execute-api.us-east-1.amazonaws.com/v1
    description: LUMI API (us-east-1, protected by WAF and Cognito JWT)
    variables:
      lumi-api-id:
        default: "your-lumi-api-gateway-id"
        description: LUMI API Gateway REST API ID (from CloudFormation output ApiGatewayUrl)
  - url: https://{pulse-api-id}.execute-api.us-east-1.amazonaws.com/v1
    description: PULSE API (us-east-1, protected by WAF and Cognito JWT)
    variables:
      pulse-api-id:
        default: "your-pulse-api-gateway-id"
        description: PULSE API Gateway REST API ID (from CloudFormation output)

security:
  - CognitoAuth: []

tags:
  - name: LUMI - Briefs
    description: Daily GM intelligence briefs, history, KPIs, action items, VIP arrivals, and audio summaries
    externalDocs:
      description: LUMI feature documentation
      url: lumi/README.md
  - name: LUMI - Settings
    description: General Manager delivery settings and preferences
    externalDocs:
      description: LUMI feature documentation
      url: lumi/README.md
  - name: PULSE - Alerts
    description: Alert feed, detail, lifecycle transitions, and the Article 14 approval gate
    externalDocs:
      description: PULSE feature documentation
      url: pulse/README.md
  - name: PULSE - History
    description: Shift-handover alert history
    externalDocs:
      description: PULSE feature documentation
      url: pulse/README.md
  - name: PULSE - Rules
    description: Administrative alert rule definitions
    externalDocs:
      description: PULSE feature documentation
      url: pulse/README.md
  - name: PULSE - Delivery
    description: Web Push subscriptions and realtime client configuration
    externalDocs:
      description: PULSE feature documentation
      url: pulse/README.md
  - name: PULSE - Operations
    description: VIP, operations, and kitchen read facades
    externalDocs:
      description: PULSE feature documentation
      url: pulse/README.md
  - name: PULSE - Demo
    description: Demo Scenario Simulator operations
    externalDocs:
      description: PULSE feature documentation
      url: pulse/README.md

paths:
  /briefs/{propertyId}:
    servers:
      - url: https://{lumi-api-id}.execute-api.us-east-1.amazonaws.com/v1
        description: LUMI API (us-east-1, protected by WAF and Cognito JWT)
        variables:
          lumi-api-id:
            default: "your-lumi-api-gateway-id"
            description: LUMI API Gateway REST API ID (from CloudFormation output)
    get:
      operationId: getBrief
      summary: Get the latest daily brief for a property
      description: |
        Returns the most recent daily brief for the specified property,
        including KPIs, action items, VIP arrivals, and audio brief metadata.
        The requesting GM must own the property (validated via Cognito claims).
      tags:
        - LUMI - Briefs
      parameters:
        - name: propertyId
          in: path
          required: true
          description: Property identifier (e.g., ALOHA-CHI-001)
          schema:
            type: string
            example: ALOHA-CHI-001
      responses:
        "200":
          description: Daily brief retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyBriefResponse"
        "401":
          description: Unauthorized - invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LumiErrorResponse"
              example:
                error:
                  code: UNAUTHORIZED
                  message: Invalid or expired token
        "403":
          description: Forbidden - user does not own this property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LumiErrorResponse"
              example:
                error:
                  code: FORBIDDEN
                  message: You do not have access to this property's brief
        "404":
          description: No brief found for property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LumiErrorResponse"
              example:
                error:
                  code: PROPERTY_NOT_FOUND
                  message: No brief found for property ALOHA-CHI-001
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LumiErrorResponse"
              example:
                error:
                  code: INTERNAL_ERROR
                  message: An internal error occurred

  /briefs/{propertyId}/{briefDate}:
    servers:
      - url: https://{lumi-api-id}.execute-api.us-east-1.amazonaws.com/v1
        description: LUMI API (us-east-1, protected by WAF and Cognito JWT)
        variables:
          lumi-api-id:
            default: "your-lumi-api-gateway-id"
            description: LUMI API Gateway REST API ID (from CloudFormation output)
    get:
      operationId: getBriefByDate
      summary: Get a specific dated brief for a property
      description: |
        Returns the brief for a specific property and date. Used by the
        frontend to display full past brief detail views from the history carousel.
      tags:
        - LUMI - Briefs
      parameters:
        - name: propertyId
          in: path
          required: true
          description: Property identifier
          schema:
            type: string
            example: ALOHA-CHI-001
        - name: briefDate
          in: path
          required: true
          description: Brief date in YYYY-MM-DD format
          schema:
            type: string
            format: date
            example: "2026-08-06"
      responses:
        "200":
          description: Dated brief retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyBriefResponse"
        "400":
          description: Invalid date format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LumiErrorResponse"
        "404":
          description: No brief found for property/date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LumiErrorResponse"

  /briefs/history:
    servers:
      - url: https://{lumi-api-id}.execute-api.us-east-1.amazonaws.com/v1
        description: LUMI API (us-east-1, protected by WAF and Cognito JWT)
        variables:
          lumi-api-id:
            default: "your-lumi-api-gateway-id"
            description: LUMI API Gateway REST API ID (from CloudFormation output)
    get:
      operationId: getBriefHistory
      summary: Get brief history summaries for a property
      description: |
        Returns a list of past brief summaries (date, status, key KPIs,
        narrative preview) for the past-briefs carousel on the main dashboard.
        Property is determined from the Cognito JWT claims (custom:propertyId).
      tags:
        - LUMI - Briefs
      parameters:
        - name: days
          in: query
          required: false
          description: Number of days of history to return
          schema:
            type: integer
            default: 7
            maximum: 30
      responses:
        "200":
          description: Brief history retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BriefHistorySummary"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LumiErrorResponse"

  /settings/{gmAlias}:
    servers:
      - url: https://{lumi-api-id}.execute-api.us-east-1.amazonaws.com/v1
        description: LUMI API (us-east-1, protected by WAF and Cognito JWT)
        variables:
          lumi-api-id:
            default: "your-lumi-api-gateway-id"
            description: LUMI API Gateway REST API ID (from CloudFormation output)
    get:
      operationId: getSettings
      summary: Get GM settings
      description: |
        Returns the current configuration for the specified GM.
        The requesting user must own the settings (gmAlias must match claims).
      tags:
        - LUMI - Settings
      parameters:
        - name: gmAlias
          in: path
          required: true
          description: GM alias identifier (e.g., jsmith)
          schema:
            type: string
            example: jsmith
      responses:
        "200":
          description: GM settings retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmSettings"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LumiErrorResponse"
        "403":
          description: Forbidden - cannot access another GM's settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LumiErrorResponse"
        "404":
          description: GM settings not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LumiErrorResponse"
              example:
                error:
                  code: SETTINGS_NOT_FOUND
                  message: No settings found for GM jsmith

    put:
      operationId: putSettings
      summary: Update GM settings
      description: |
        Updates the GM's configuration. Partial updates are supported -
        only provided fields are updated. All fields are validated before persist.
      tags:
        - LUMI - Settings
      parameters:
        - name: gmAlias
          in: path
          required: true
          description: GM alias identifier
          schema:
            type: string
            example: jsmith
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GmSettingsUpdate"
            example:
              briefDeliveryTime: "06:30"
              alertToggles:
                overbookingRisk: true
                roomsOutOfOrder: true
                vipArrivalAlert: true
                upsellOpportunity: true
                staffingConfirmed: true
              kpiThresholds:
                occupancyAlertBelow: 70
                adrAlertBelow: 200
              audioPreferences:
                language: en-US
                briefLength: standard
      responses:
        "200":
          description: Settings updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GmSettings"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LumiErrorResponse"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: "briefDeliveryTime must be in HH:MM format (00:00-23:59)"
                  field: briefDeliveryTime
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LumiErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LumiErrorResponse"
        "404":
          description: GM settings not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LumiErrorResponse"

  /alerts:
    servers:
      - url: https://{pulse-api-id}.execute-api.us-east-1.amazonaws.com/v1
        description: PULSE API (us-east-1, protected by WAF and Cognito JWT)
        variables:
          pulse-api-id:
            default: "your-pulse-api-gateway-id"
            description: PULSE API Gateway REST API ID (from CloudFormation output)
    get:
      operationId: listAlerts
      summary: List alerts (feed + optional tier/status filters)
      description: |
        Returns the alert feed for the caller, scoped to their associated
        properties and ordered newest-first per property. Optional `tier` and
        `status` filters narrow the result. When `propertyId` is supplied the
        caller must be associated with it, otherwise an empty result is returned
        without leaking existence.
      tags:
        - PULSE - Alerts
      parameters:
        - name: propertyId
          in: query
          required: false
          description: Restrict the feed to a single property the caller owns
          schema:
            type: string
            example: ALOHA-CHI-001
        - name: tier
          in: query
          required: false
          description: Filter by alert tier (case-insensitive)
          schema:
            $ref: "#/components/schemas/AlertTier"
        - name: status
          in: query
          required: false
          description: Filter by alert status (case-insensitive)
          schema:
            $ref: "#/components/schemas/AlertStatus"
      responses:
        "200":
          description: Alert feed retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /alerts/{alertId}:
    servers:
      - url: https://{pulse-api-id}.execute-api.us-east-1.amazonaws.com/v1
        description: PULSE API (us-east-1, protected by WAF and Cognito JWT)
        variables:
          pulse-api-id:
            default: "your-pulse-api-gateway-id"
            description: PULSE API Gateway REST API ID (from CloudFormation output)
    get:
      operationId: getAlert
      summary: Get a single alert (detail including triage brief)
      description: |
        Returns the full alert item, including the agent-generated `triageBrief`
        when present. Returns 404 when the alert does not exist or belongs to a
        property the caller is not associated with (existence is not leaked).
      tags:
        - PULSE - Alerts
      parameters:
        - $ref: "#/components/parameters/AlertId"
      responses:
        "200":
          description: Alert retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Alert not found or out of scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  message: Alert not found
        "500":
          $ref: "#/components/responses/InternalError"

  /alerts/{alertId}/acknowledgements:
    servers:
      - url: https://{pulse-api-id}.execute-api.us-east-1.amazonaws.com/v1
        description: PULSE API (us-east-1, protected by WAF and Cognito JWT)
        variables:
          pulse-api-id:
            default: "your-pulse-api-gateway-id"
            description: PULSE API Gateway REST API ID (from CloudFormation output)
    post:
      operationId: acknowledgeAlert
      summary: Acknowledge an alert
      description: |
        Transitions an open alert (UNACKNOWLEDGED or ESCALATED) to ACKNOWLEDGED,
        recording the acknowledging user and a UTC timestamp, and halting any
        in-flight escalation. A resolved alert cannot be acknowledged.
      tags:
        - PULSE - Alerts
      parameters:
        - $ref: "#/components/parameters/AlertId"
      responses:
        "200":
          description: Alert acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusTransitionResponse"
              example:
                alertId: alert-8f2c
                status: ACKNOWLEDGED
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Alert not found or out of scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  message: Alert not found
        "409":
          description: Alert cannot be acknowledged (invalid or terminal transition)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  message: Alert cannot be acknowledged
                  reason: already-resolved
        "500":
          $ref: "#/components/responses/InternalError"

  /alerts/{alertId}/resolutions:
    servers:
      - url: https://{pulse-api-id}.execute-api.us-east-1.amazonaws.com/v1
        description: PULSE API (us-east-1, protected by WAF and Cognito JWT)
        variables:
          pulse-api-id:
            default: "your-pulse-api-gateway-id"
            description: PULSE API Gateway REST API ID (from CloudFormation output)
    post:
      operationId: resolveAlert
      summary: Resolve an alert
      description: |
        Transitions an open alert (UNACKNOWLEDGED, ACKNOWLEDGED, or ESCALATED) to
        RESOLVED, recording the resolving user and a UTC timestamp. RESOLVED is
        terminal; resolving an already-resolved alert is rejected with state
        unchanged.
      tags:
        - PULSE - Alerts
      parameters:
        - $ref: "#/components/parameters/AlertId"
      responses:
        "200":
          description: Alert resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusTransitionResponse"
              example:
                alertId: alert-8f2c
                status: RESOLVED
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Alert not found or out of scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  message: Alert not found
        "409":
          description: Alert cannot be resolved (already terminal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  message: Alert cannot be resolved
                  reason: already-resolved
        "500":
          $ref: "#/components/responses/InternalError"

  /alerts/{alertId}/approvals:
    servers:
      - url: https://{pulse-api-id}.execute-api.us-east-1.amazonaws.com/v1
        description: PULSE API (us-east-1, protected by WAF and Cognito JWT)
        variables:
          pulse-api-id:
            default: "your-pulse-api-gateway-id"
            description: PULSE API Gateway REST API ID (from CloudFormation output)
    post:
      operationId: decideApproval
      summary: Approve or reject a triage ranked option (Article 14 gate)
      description: |
        Records a GM decision on a CRITICAL alert's ranked option. This is the EU
        AI Act Article 14 human-approval gate: the Action Executor performs the
        resolving write-back (and transactionally sets the alert RESOLVED) **only**
        when a decision of `approve` is accepted. A decision of `reject` records
        the rejection and never executes. An approval must name a `selectedOption`
        that exists on the alert's triage brief when the brief carries options.
      tags:
        - PULSE - Alerts
      parameters:
        - $ref: "#/components/parameters/AlertId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
            example:
              decision: approve
              selectedOption: A
      responses:
        "200":
          description: Approval decision accepted (executor may have run on approve)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
              example:
                accepted: true
                approvalState: APPROVED
                selectedOption: A
                executed: true
                execution:
                  executed: true
                  resolvedAlertId: alert-8f2c
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Alert not found or out of scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  message: Alert not found
        "409":
          description: Approval decision rejected (already decided, invalid option, or resolved)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  message: Approval decision rejected
                  reason: invalid-option
        "500":
          $ref: "#/components/responses/InternalError"

  /shift-handover:
    servers:
      - url: https://{pulse-api-id}.execute-api.us-east-1.amazonaws.com/v1
        description: PULSE API (us-east-1, protected by WAF and Cognito JWT)
        variables:
          pulse-api-id:
            default: "your-pulse-api-gateway-id"
            description: PULSE API Gateway REST API ID (from CloudFormation output)
    get:
      operationId: getShiftHandover
      summary: Get the shift-handover log for a property window
      description: |
        Returns every alert for a property whose creation time falls within the
        `[from, to]` window (inclusive), ordered newest-first. `propertyId`,
        `from`, and `to` are all required. A window for a property the caller is
        not associated with returns an empty result rather than leaking existence.
      tags:
        - PULSE - History
      parameters:
        - name: propertyId
          in: query
          required: true
          description: Property identifier
          schema:
            type: string
            example: ALOHA-CHI-001
        - name: from
          in: query
          required: true
          description: Window start (ISO 8601), inclusive
          schema:
            type: string
            format: date-time
            example: "2026-08-17T06:00:00Z"
        - name: to
          in: query
          required: true
          description: Window end (ISO 8601), inclusive
          schema:
            type: string
            format: date-time
            example: "2026-08-17T14:00:00Z"
      responses:
        "200":
          description: Shift-handover log retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertListResponse"
        "400":
          description: Missing required query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  message: propertyId, from, and to are required
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /rules:
    servers:
      - url: https://{pulse-api-id}.execute-api.us-east-1.amazonaws.com/v1
        description: PULSE API (us-east-1, protected by WAF and Cognito JWT)
        variables:
          pulse-api-id:
            default: "your-pulse-api-gateway-id"
            description: PULSE API Gateway REST API ID (from CloudFormation output)
    get:
      operationId: listRules
      summary: List rule definitions for a property
      description: |
        Returns the alert rule definitions for the requested property. Returns an
        empty list when `propertyId` is missing or the caller is not associated
        with it.
      tags:
        - PULSE - Rules
      parameters:
        - name: propertyId
          in: query
          required: true
          description: Property identifier
          schema:
            type: string
            example: ALOHA-CHI-001
      responses:
        "200":
          description: Rule definitions retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /rules/{ruleId}:
    servers:
      - url: https://{pulse-api-id}.execute-api.us-east-1.amazonaws.com/v1
        description: PULSE API (us-east-1, protected by WAF and Cognito JWT)
        variables:
          pulse-api-id:
            default: "your-pulse-api-gateway-id"
            description: PULSE API Gateway REST API ID (from CloudFormation output)
    put:
      operationId: updateRule
      summary: Update a rule definition (admin)
      description: |
        Validates and persists a rule-definition update. The `{ruleId}` path
        parameter is the composite `"{propertyId}#{ruleType}"`; its components are
        merged into the body so the URL identity is authoritative. On rejection
        nothing is written (the prior definition is retained) and the offending
        attribute is reported. The update is denied when the caller is not
        associated with the target property.
      tags:
        - PULSE - Rules
      parameters:
        - name: ruleId
          in: path
          required: true
          description: Composite rule id "{propertyId}#{ruleType}"
          schema:
            type: string
            example: ALOHA-CHI-001#WALK_RISK
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleUpdate"
            example:
              tier: CRITICAL
              triggerCondition:
                operator: gt
                left: reservations.confirmed
                right: rooms.available
              parameters:
                loyaltyProtectionTier: Gold
              agentTriageEnabled: true
              escalationTimeoutSec: 300
              enabled: true
      responses:
        "200":
          description: Rule updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleUpdateResponse"
        "400":
          description: Validation error; prior definition retained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  message: Rule update rejected; prior definition retained
                  invalidAttribute: escalationTimeoutSec
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller not associated with the target property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  message: Not authorized for this property
        "500":
          $ref: "#/components/responses/InternalError"

  /push-subscriptions:
    servers:
      - url: https://{pulse-api-id}.execute-api.us-east-1.amazonaws.com/v1
        description: PULSE API (us-east-1, protected by WAF and Cognito JWT)
        variables:
          pulse-api-id:
            default: "your-pulse-api-gateway-id"
            description: PULSE API Gateway REST API ID (from CloudFormation output)
    post:
      operationId: registerPushSubscription
      summary: Register a Web Push (VAPID) subscription
      description: |
        Registers the browser's Web Push subscription so the delivery layer can
        wake a closed or backgrounded PWA for CRITICAL/WARNING alerts. The
        subscription is always stored under the authenticated caller's identity.
      tags:
        - PULSE - Delivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionRequest"
            example:
              endpoint: https://web.push.apple.com/Qf...
              p256dh: BPx...
              auth: k9d...
      responses:
        "201":
          description: Subscription registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscriptionResponse"
              example:
                registered: true
                endpointHash: 3b1f9a...c7
        "400":
          description: Subscription missing a required field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  message: Invalid subscription
                  missing: endpoint
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /config/vapid-public-key:
    servers:
      - url: https://{pulse-api-id}.execute-api.us-east-1.amazonaws.com/v1
        description: PULSE API (us-east-1, protected by WAF and Cognito JWT)
        variables:
          pulse-api-id:
            default: "your-pulse-api-gateway-id"
            description: PULSE API Gateway REST API ID (from CloudFormation output)
    get:
      operationId: getVapidPublicKey
      summary: Get the VAPID public key for Web Push subscription
      description: |
        Returns the VAPID public key the PWA service worker uses to create its
        Web Push subscription.
      tags:
        - PULSE - Delivery
      responses:
        "200":
          description: VAPID public key retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapidPublicKeyResponse"
              example:
                publicKey: BPx...
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /config/realtime:
    servers:
      - url: https://{pulse-api-id}.execute-api.us-east-1.amazonaws.com/v1
        description: PULSE API (us-east-1, protected by WAF and Cognito JWT)
        variables:
          pulse-api-id:
            default: "your-pulse-api-gateway-id"
            description: PULSE API Gateway REST API ID (from CloudFormation output)
    get:
      operationId: getRealtimeConfig
      summary: Get the AppSync Events realtime endpoint configuration
      description: |
        Returns the AWS AppSync Events endpoints and channel namespace the PWA
        uses to subscribe to the foreground realtime alert feed over WebSocket.
        The realtime feed itself is delivered over that WebSocket channel, not
        over this REST API.
      tags:
        - PULSE - Delivery
      responses:
        "200":
          description: Realtime configuration retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeConfigResponse"
              example:
                httpEndpoint: https://abc123.appsync-api.us-east-1.amazonaws.com/event
                wssEndpoint: wss://abc123.appsync-realtime-api.us-east-1.amazonaws.com/event
                namespace: pulse
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /vips:
    servers:
      - url: https://{pulse-api-id}.execute-api.us-east-1.amazonaws.com/v1
        description: PULSE API (us-east-1, protected by WAF and Cognito JWT)
        variables:
          pulse-api-id:
            default: "your-pulse-api-gateway-id"
            description: PULSE API Gateway REST API ID (from CloudFormation output)
    get:
      operationId: getVips
      summary: Get VIP arrivals grouped by loyalty tier
      description: |
        Returns live VIP arrivals for a property, grouped by loyalty tier and
        ordered by eliteness, for the PWA VIPs tab. Backed by the shared StayOS
        AgentCore Gateway (`get_vip_guests`), scoped server-side to the property.
        Sensitive guest notes are never returned.
      tags:
        - PULSE - Operations
      parameters:
        - $ref: "#/components/parameters/RequiredPropertyId"
      responses:
        "200":
          description: VIP arrivals retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VipsResponse"
        "400":
          $ref: "#/components/responses/PropertyIdRequired"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PropertyForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/OpsDataUnavailable"

  /ops:
    servers:
      - url: https://{pulse-api-id}.execute-api.us-east-1.amazonaws.com/v1
        description: PULSE API (us-east-1, protected by WAF and Cognito JWT)
        variables:
          pulse-api-id:
            default: "your-pulse-api-gateway-id"
            description: PULSE API Gateway REST API ID (from CloudFormation output)
    get:
      operationId: getOps
      summary: Get the operations snapshot (facility, OOO rooms, group checkout)
      description: |
        Returns the Ops tab snapshot for a property: a facility summary,
        out-of-order (OOO) room cards each annotated with their joined work-order
        status, and a group-checkout summary. Backed by the shared Gateway
        (`get_occupancy`, `get_room_status`, `get_work_orders`), scoped
        server-side to the property.
      tags:
        - PULSE - Operations
      parameters:
        - $ref: "#/components/parameters/RequiredPropertyId"
      responses:
        "200":
          description: Operations snapshot retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsResponse"
        "400":
          $ref: "#/components/responses/PropertyIdRequired"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PropertyForbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/OpsDataUnavailable"

  /kitchen:
    servers:
      - url: https://{pulse-api-id}.execute-api.us-east-1.amazonaws.com/v1
        description: PULSE API (us-east-1, protected by WAF and Cognito JWT)
        variables:
          pulse-api-id:
            default: "your-pulse-api-gateway-id"
            description: PULSE API Gateway REST API ID (from CloudFormation output)
    get:
      operationId: getKitchen
      summary: Get the property's Kitchen and F&B snapshot
      description: |
        Returns the property-scoped Kitchen snapshot. Today's Orders value is
        the daily total, including completed orders. Its In-flight count is
        derived from the active kitchenOrders array, including for snapshots
        stored before this normalization was introduced. The read does not
        write or reseed the stored snapshot.
      tags:
        - PULSE - Operations
      parameters:
        - $ref: "#/components/parameters/RequiredPropertyId"
      responses:
        "200":
          description: Kitchen snapshot retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitchenSnapshot"
        "400":
          $ref: "#/components/responses/PropertyIdRequired"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PropertyForbidden"
        "404":
          description: Kitchen snapshot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /demo/scenarios/{scenarioId}:
    servers:
      - url: https://{pulse-api-id}.execute-api.us-east-1.amazonaws.com/v1
        description: PULSE API (us-east-1, protected by WAF and Cognito JWT)
        variables:
          pulse-api-id:
            default: "your-pulse-api-gateway-id"
            description: PULSE API Gateway REST API ID (from CloudFormation output)
    post:
      operationId: runDemoScenario
      summary: Run a demo scenario (demo-only)
      description: |
        **Demo-only.** Drives the Demo Scenario Simulator in-process to apply a
        deterministic operational-data mutation that raises the scenario's
        triggering condition. Exposed only when `EnableDemoSimulator` is truthy
        (default); a real deployment sets it false and this route returns 404 as
        if absent.
      tags:
        - PULSE - Demo
      parameters:
        - $ref: "#/components/parameters/ScenarioId"
      responses:
        "200":
          description: Scenario mutation applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoScenarioResponse"
              example:
                scenarioId: walk-risk
                action: run
                operation: MODIFY
                tableKind: reservations
                expectedAlertType: WALK_RISK
        "400":
          description: Invalid demo scenario action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  message: Invalid demo scenario action
                  detail: unsupported action
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown scenario (or demo surface disabled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  message: Unknown demo scenario
                  scenarioId: not-a-scenario
        "500":
          $ref: "#/components/responses/InternalError"

  /demo/scenarios/{scenarioId}/reset:
    servers:
      - url: https://{pulse-api-id}.execute-api.us-east-1.amazonaws.com/v1
        description: PULSE API (us-east-1, protected by WAF and Cognito JWT)
        variables:
          pulse-api-id:
            default: "your-pulse-api-gateway-id"
            description: PULSE API Gateway REST API ID (from CloudFormation output)
    post:
      operationId: resetDemoScenario
      summary: Reset a demo scenario (demo-only)
      description: |
        **Demo-only.** Drives the Demo Scenario Simulator in-process to apply the
        deterministic mutation that clears the scenario's triggering condition
        (the reset counterpart to running the scenario). Exposed only when
        `EnableDemoSimulator` is truthy; otherwise returns 404 as if absent.
      tags:
        - PULSE - Demo
      parameters:
        - $ref: "#/components/parameters/ScenarioId"
      responses:
        "200":
          description: Scenario reset mutation applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoScenarioResponse"
              example:
                scenarioId: walk-risk
                action: reset
                operation: MODIFY
                tableKind: reservations
                expectedAlertType: WALK_RISK
        "400":
          description: Invalid demo scenario action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  message: Invalid demo scenario action
                  detail: unsupported action
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown scenario (or demo surface disabled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  message: Unknown demo scenario
                  scenarioId: not-a-scenario
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    CognitoAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Amazon Cognito JWT (access token or ID token)

  parameters:
    AlertId:
      name: alertId
      in: path
      required: true
      description: Unique alert identifier
      schema:
        type: string
        example: alert-8f2c
    RequiredPropertyId:
      name: propertyId
      in: query
      required: true
      description: Property identifier (server-side scoped to the caller)
      schema:
        type: string
        example: ALOHA-CHI-001
    ScenarioId:
      name: scenarioId
      in: path
      required: true
      description: Demo scenario identifier
      schema:
        type: string
        example: walk-risk

  responses:
    Unauthorized:
      description: Unauthorized - invalid, expired, or missing token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: Unauthorized
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: Internal server error
    PropertyIdRequired:
      description: The propertyId query parameter is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: propertyId is required
    PropertyForbidden:
      description: Caller not associated with the requested property
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: Not authorized for this property
    OpsDataUnavailable:
      description: Live operations data temporarily unavailable (Gateway degraded)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              message: Live operations data is temporarily unavailable
              reason: gateway-timeout

  schemas:
    # -----------------------------------------------------------------------
    # LUMI daily brief and settings shapes
    # -----------------------------------------------------------------------
    LumiErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable error code
              example: VALIDATION_ERROR
            message:
              type: string
              description: Human-readable error description
              example: "briefDeliveryTime must be in HH:MM format"
            field:
              type: string
              description: Field name for validation errors (optional)
              example: briefDeliveryTime

    DailyBriefResponse:
      type: object
      required:
        - property
        - dailyKPIs
        - actionItems
        - vipArrivals
        - audioBrief
      properties:
        property:
          $ref: "#/components/schemas/Property"
        dailyKPIs:
          $ref: "#/components/schemas/DailyKPIs"
        actionItems:
          type: array
          items:
            $ref: "#/components/schemas/ActionItem"
        vipArrivals:
          type: array
          items:
            $ref: "#/components/schemas/VipArrival"
        audioBrief:
          $ref: "#/components/schemas/AudioBrief"

    Property:
      type: object
      properties:
        propertyId:
          type: string
          example: ALOHA-CHI-001
        propertyName:
          type: string
          example: Aloha Grand Chicago
        brand:
          type: string
          example: "Aloha Hotels & Resorts"
        timezone:
          type: string
          example: America/Chicago
        totalRooms:
          type: integer
          example: 368

    DailyKPIs:
      type: object
      required:
        - date
        - asOf
        - occupancy
        - adr
        - revPAR
        - arrivals
        - departures
      properties:
        date:
          type: string
          format: date
          example: "2026-08-03"
        asOf:
          type: string
          format: date-time
          example: "2026-08-03T09:07:00-05:00"
        occupancy:
          $ref: "#/components/schemas/Occupancy"
        adr:
          $ref: "#/components/schemas/Adr"
        revPAR:
          $ref: "#/components/schemas/RevPar"
        arrivals:
          $ref: "#/components/schemas/Arrivals"
        departures:
          $ref: "#/components/schemas/Departures"
        confirmedReservations:
          type: integer
          example: 374
        availableRooms:
          type: integer
          description: Legacy field for total room inventory capacity; not vacant or remaining sellable rooms.
          example: 368

    Occupancy:
      type: object
      properties:
        current:
          type: number
          description: Current occupancy percentage
          example: 87
        unit:
          type: string
          enum: [percent]
          example: percent
        vsLastWeek:
          type: number
          format: float
          description: Delta vs same day last week
          example: 4.2
        vsBudget:
          type: number
          format: float
          description: Delta vs budget
          example: 2.1
        forecast3pm:
          type: number
          description: Prototype baseline using current occupancy; no separate intraday forecast exists in the dataset.
          example: 91

    Adr:
      type: object
      properties:
        current:
          type: number
          description: Current ADR in currency units
          example: 248
        currency:
          type: string
          example: USD
        vsLastWeek:
          type: number
          format: float
          example: 12
        vsBudget:
          type: number
          format: float
          example: 8
        pacePctOfBudget:
          type: integer
          description: Pace as percentage of budget
          example: 103

    RevPar:
      type: object
      properties:
        current:
          type: number
          description: Current RevPAR in currency units
          example: 216
        currency:
          type: string
          example: USD
        vsYOY:
          type: number
          format: float
          description: Year-over-year percentage change
          example: 7.1
        budget:
          type: number
          description: Estimated budget at constant ADR, derived from the occupancy budget delta.
          example: 202

    Arrivals:
      type: object
      properties:
        total:
          type: integer
          example: 142
        vipCount:
          type: integer
          example: 7
        ambassadorCount:
          type: integer
          example: 3
        titaniumCount:
          type: integer
          example: 4
        platinumCount:
          type: integer
          example: 0

    Departures:
      type: object
      properties:
        total:
          type: integer
          example: 118
        groupCheckouts:
          type: integer
          example: 1
        groupRooms:
          type: integer
          example: 82

    ActionItem:
      type: object
      required:
        - id
        - type
        - severity
        - title
        - detail
      properties:
        id:
          type: string
          example: action-001
        type:
          type: string
          enum:
            - OVERBOOKING_RISK
            - ROOMS_OUT_OF_ORDER
            - VIP_ARRIVAL_ALERT
            - UPSELL_OPPORTUNITY
            - STAFFING_CONFIRMED
          example: OVERBOOKING_RISK
        severity:
          type: string
          enum: [URGENT, HIGH, MEDIUM, LOW]
          example: URGENT
        title:
          type: string
          example: "Overbooking Risk - +6 Rooms"
        detail:
          type: string
          example: "374 confirmed vs 368 available. Walk strategy required by 7 AM."
        data:
          type: object
          description: Type-specific payload (varies by action type)
          additionalProperties: true
        source:
          type: string
          description: Data source that generated this action
          example: SPOG_XPMS
        generatedAt:
          type: string
          format: date-time
          example: "2026-08-03T06:00:00-05:00"

    VipArrival:
      type: object
      required:
        - guestId
        - guestName
        - loyaltyTier
        - roomNumber
      properties:
        guestId:
          type: string
          example: ALH-MBR-00238471
        guestName:
          type: string
          example: David Chen
        initials:
          type: string
          example: DC
        loyaltyTier:
          type: string
          enum: [AMBASSADOR, TITANIUM, PLATINUM]
          example: AMBASSADOR
        totalStays:
          type: integer
          example: 47
        roomNumber:
          type: string
          example: "2401"
        roomType:
          type: string
          enum: [PENTHOUSE, SUITE, KING_DELUXE, QUEEN_DELUXE, KING_STANDARD]
          example: SUITE
        estimatedArrival:
          type: string
          format: date-time
          example: "2026-08-03T14:00:00-05:00"
        specialOccasion:
          type: string
          nullable: true
          enum: [ANNIVERSARY, BIRTHDAY, null]
          example: ANNIVERSARY
        preferences:
          type: array
          items:
            type: string
          example: ["HIGH_FLOOR", "FEATHER_FREE_BEDDING", "CHAMPAGNE_ARRIVAL"]
        accountType:
          type: string
          enum: [PERSONAL, CORPORATE]
          example: PERSONAL

    AudioBrief:
      type: object
      required:
        - briefId
        - status
      properties:
        briefId:
          type: string
          example: brief-2026-08-03-ALOHA-CHI-001
        durationSeconds:
          type: integer
          description: Audio duration in seconds
          example: 74
        status:
          type: string
          enum: [READY, GENERATING, FAILED, TEXT_ONLY]
          example: READY
        audioUrl:
          type: string
          format: uri
          description: CloudFront URL for streaming the audio brief
          example: "https://audio.lumi.example.com/briefs/2026/08/03/ALOHA-CHI-001/morning-brief.mp3"
        transcriptSnippet:
          type: string
          description: First few sentences of the AI-generated narrative
          example: "Good morning, Jennifer..."

    GmSettings:
      type: object
      required:
        - gmAlias
        - propertyId
        - briefDeliveryTime
        - alertToggles
        - kpiThresholds
        - audioPreferences
      properties:
        gmAlias:
          type: string
          example: jsmith
        propertyId:
          type: string
          example: ALOHA-CHI-001
        briefDeliveryTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          description: "Brief delivery time in HH:MM format (24-hour)"
          example: "06:30"
        alertToggles:
          $ref: "#/components/schemas/AlertToggles"
        kpiThresholds:
          $ref: "#/components/schemas/KpiThresholds"
        audioPreferences:
          $ref: "#/components/schemas/AudioPreferences"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GmSettingsUpdate:
      type: object
      description: Partial update - only include fields to change
      properties:
        briefDeliveryTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          description: "Brief delivery time in HH:MM format (24-hour)"
          example: "06:30"
        alertToggles:
          $ref: "#/components/schemas/AlertToggles"
        kpiThresholds:
          $ref: "#/components/schemas/KpiThresholds"
        audioPreferences:
          $ref: "#/components/schemas/AudioPreferences"

    AlertToggles:
      type: object
      properties:
        overbookingRisk:
          type: boolean
          example: true
        roomsOutOfOrder:
          type: boolean
          example: true
        vipArrivalAlert:
          type: boolean
          example: true
        upsellOpportunity:
          type: boolean
          example: true
        staffingConfirmed:
          type: boolean
          example: true

    KpiThresholds:
      type: object
      properties:
        occupancyAlertBelow:
          type: integer
          minimum: 0
          maximum: 100
          description: Alert when occupancy drops below this percentage
          example: 70
        adrAlertBelow:
          type: integer
          minimum: 0
          maximum: 1000
          description: Alert when ADR drops below this value
          example: 200

    AudioPreferences:
      type: object
      properties:
        language:
          type: string
          enum: [en-US, es-ES, ja-JP, zh-CN]
          description: Audio brief language
          example: en-US
        briefLength:
          type: string
          enum: [brief, standard, detailed]
          description: Preferred brief length
          example: standard

    BriefHistorySummary:
      type: object
      required:
        - briefDate
        - status
        - dailyKPIs
      properties:
        briefDate:
          type: string
          format: date
          example: "2026-08-06"
        status:
          type: string
          enum: [DELIVERED, GENERATED, FAILED]
          example: DELIVERED
        dailyKPIs:
          type: object
          properties:
            occupancy:
              type: object
              properties:
                current:
                  type: integer
                  example: 85
            adr:
              type: object
              properties:
                current:
                  type: integer
                  example: 248
            revPAR:
              type: object
              properties:
                current:
                  type: integer
                  example: 211
        narrativePreview:
          type: string
          description: First sentence of the AI-generated narrative
          example: "Buenos dias, Jennifer. Hoy es viernes, 7..."

    OooRoomDetail:
      type: object
      description: Out-of-order room detail within ROOMS_OUT_OF_ORDER action item data
      properties:
        roomNumber:
          type: string
          example: "2102"
        issue:
          type: string
          description: Issue type from the linked work order
          example: IT_NETWORK
        isPremium:
          type: boolean
          example: true
        view:
          type: string
          enum: [LAKE, PARK, CITY, OCEAN, NONE]
          example: LAKE
        workOrderId:
          type: string
          example: WO-CHI-0146
        openHours:
          type: integer
          description: Hours since work order creation (or estimated resolution hours if timestamp is unavailable)
          example: 14

    # -----------------------------------------------------------------------
    # PULSE alerting and operations shapes
    # -----------------------------------------------------------------------
    # -----------------------------------------------------------------------
    # Enumerations (values match pulse.common.models exactly)
    # -----------------------------------------------------------------------
    AlertTier:
      type: string
      description: Severity classification of an alert
      enum: [CRITICAL, WARNING, INFO]
      example: CRITICAL

    AlertStatus:
      type: string
      description: Lifecycle state of an alert (RESOLVED is terminal)
      enum:
        - UNACKNOWLEDGED
        - ACKNOWLEDGED
        - RESOLVED
        - ESCALATED
        - ESCALATION_EXHAUSTED
      example: UNACKNOWLEDGED

    AlertType:
      type: string
      description: The MVP alert types (UC-01 through UC-06)
      enum:
        - WALK_RISK
        - VIP_ROOM_NOT_READY
        - COMPLAINT_ESCALATION
        - OOO_CLUSTER
        - PREMIUM_CANCELLATION
        - VIP_CHECKIN
      example: WALK_RISK

    EscalationStatus:
      type: string
      description: Whether an alert has been surfaced for mandatory GM review
      enum: [NONE, MANDATORY_GM_REVIEW]
      example: NONE

    EscalationReason:
      type: string
      description: A reason an alert was flagged for mandatory GM review
      enum:
        - legal-safety
        - vip-ambassador
        - dollar-threshold
        - low-confidence
        - repeat-issue
        - sla-or-eta
        - manager-requested
        - threshold-unavailable
      example: dollar-threshold

    ReviewRisk:
      type: string
      description: Discrete review-risk level on a complaint ranked option
      enum: [Low, Medium, High]
      example: Medium

    ApprovalState:
      type: string
      description: State of the human-approval gate for a CRITICAL alert
      enum: [PENDING, APPROVED, REJECTED]
      example: PENDING

    # -----------------------------------------------------------------------
    # Error envelope (matches pulse.api.http.error_response)
    # -----------------------------------------------------------------------
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
          description: |
            Error object. Always carries a human-readable `message`; individual
            routes may add context fields such as `reason`, `missing`,
            `invalidAttribute`, `scenarioId`, or `detail`.
          properties:
            message:
              type: string
              description: Human-readable error description
              example: Alert not found
            reason:
              type: string
              description: Machine-friendly reason (lifecycle/approval rejections, Gateway failures)
              example: already-resolved
            missing:
              type: string
              description: First missing required field (subscription validation)
              example: endpoint
            invalidAttribute:
              type: string
              description: Offending attribute name (rule-update validation)
              example: escalationTimeoutSec
            scenarioId:
              type: string
              description: Scenario id (unknown demo scenario)
              example: not-a-scenario
            detail:
              type: string
              description: Additional detail (invalid demo scenario action)
              example: unsupported action
          additionalProperties: true

    # -----------------------------------------------------------------------
    # Alert and nested triage/approval shapes
    # -----------------------------------------------------------------------
    SourceEntityRef:
      type: object
      description: Correlation pointer from an alert back to the operational record
      properties:
        table:
          type: string
          example: stayos-reservations
        propertyId:
          type: string
          example: ALOHA-CHI-001
        entityKey:
          type: string
          example: ALOHA-CHI-001#2026-08-17
        ruleType:
          $ref: "#/components/schemas/AlertType"

    WalkableGuest:
      type: object
      description: A confirmed guest identified as walkable in a Walk Strategy
      properties:
        guestId:
          type: string
          example: ALH-MBR-00238471
        loyaltyTier:
          type: string
          example: MEMBER
        reservationId:
          type: string
          example: RES-CHI-99213

    CompensationPackage:
      type: object
      description: A drafted compensation package for a single walkable guest
      properties:
        guestId:
          type: string
          example: ALH-MBR-00238471
        description:
          type: string
          example: Sister-property night + transport + $150 F&B credit
        estimatedCost:
          type: number
          format: float
          description: Estimated cost in the property currency
          example: 320.0

    WalkStrategy:
      type: object
      description: A GM-approvable plan to relocate guests when a property is oversold
      properties:
        sisterPropertyId:
          type: string
          nullable: true
          example: ALOHA-CHI-002
        sisterPropertyAvailable:
          type: boolean
          example: true
        walkableGuests:
          type: array
          items:
            $ref: "#/components/schemas/WalkableGuest"
        compensation:
          type: array
          items:
            $ref: "#/components/schemas/CompensationPackage"

    RankedOption:
      type: object
      description: A single GM-selectable action produced by the Triage Agent
      required:
        - label
        - rank
        - title
        - detail
      properties:
        label:
          type: string
          description: Unique option label (A, B, C, ...)
          example: A
        rank:
          type: integer
          description: Unique 1-based rank position (1 = highest)
          example: 1
        title:
          type: string
          example: Walk 6 lowest-loyalty guests to ALOHA-CHI-002
        detail:
          type: string
          example: Relocate 6 confirmed guests at or below the protection tier with full compensation.
        recommended:
          type: boolean
          description: Whether this is the single recommended option
          example: true
        estimatedCost:
          type: number
          format: float
          nullable: true
          description: Numeric cost in the property currency (complaint options)
          example: 1920.0
        reviewRisk:
          allOf:
            - $ref: "#/components/schemas/ReviewRisk"
          nullable: true
          description: Discrete review-risk level (complaint options)

    TriageBrief:
      type: object
      description: Agent-generated decision package for a CRITICAL or WARNING alert
      required:
        - summary
        - confidence
      properties:
        summary:
          type: string
          description: Situation summary (1-500 chars)
          example: Property oversold by 6 rooms for tonight; walk the 6 lowest-loyalty confirmed guests.
        confidence:
          type: integer
          minimum: 0
          maximum: 100
          description: Integer confidence percentage
          example: 88
        options:
          type: array
          description: Ranked options, ordered highest to lowest rank (2-5)
          items:
            $ref: "#/components/schemas/RankedOption"
        walkStrategy:
          allOf:
            - $ref: "#/components/schemas/WalkStrategy"
          nullable: true
          description: Present for Walk Risk alerts
        executeLabel:
          type: string
          nullable: true
          description: Optional label for the approval action control
          example: Approve walk strategy

    ApprovalRecord:
      type: object
      description: The human-approval gate state recorded on an alert
      properties:
        state:
          $ref: "#/components/schemas/ApprovalState"
        selectedOption:
          type: string
          nullable: true
          example: A
        decidedBy:
          type: string
          nullable: true
          example: jsmith
        decidedAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-08-17T07:12:04Z"

    Alert:
      type: object
      description: A persisted PULSE alert (the pulse-alerts item)
      required:
        - alertId
        - propertyId
        - tier
        - type
        - title
        - detail
        - status
        - createdAt
      properties:
        alertId:
          type: string
          example: alert-8f2c
        propertyId:
          type: string
          example: ALOHA-CHI-001
        tier:
          $ref: "#/components/schemas/AlertTier"
        type:
          $ref: "#/components/schemas/AlertType"
        title:
          type: string
          description: 1-200 characters
          example: "Walk Risk - oversold by 6 rooms"
        detail:
          type: string
          description: 1-2000 characters
          example: "374 confirmed vs 368 available for 2026-08-17. Shortfall of 6."
        status:
          $ref: "#/components/schemas/AlertStatus"
        createdAt:
          type: string
          format: date-time
          example: "2026-08-17T06:58:11Z"
        dedupeKey:
          type: string
          example: WALK_RISK#ALOHA-CHI-001#2026-08-17
        sourceEntityRef:
          $ref: "#/components/schemas/SourceEntityRef"
        gmAlias:
          type: string
          nullable: true
          example: jsmith
        triageBrief:
          allOf:
            - $ref: "#/components/schemas/TriageBrief"
          nullable: true
        escalationStatus:
          $ref: "#/components/schemas/EscalationStatus"
        escalationReasons:
          type: array
          items:
            $ref: "#/components/schemas/EscalationReason"
        escalationChain:
          type: array
          description: Ordered recipient aliases [GM, AGM, MOD]
          items:
            type: string
          example: [jsmith, agm-chi, mod-chi]
        escalationPosition:
          type: integer
          description: 0-based index of the current recipient
          example: 0
        escalationTimeoutMin:
          type: integer
          nullable: true
          example: 5
        escalationNextCheckAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-08-17T07:03:11Z"
        incompleteInputData:
          type: boolean
          example: false
        acknowledgedBy:
          type: string
          nullable: true
        acknowledgedAt:
          type: string
          format: date-time
          nullable: true
        resolvedBy:
          type: string
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        approval:
          $ref: "#/components/schemas/ApprovalRecord"
        lastStatusChangeAt:
          type: string
          format: date-time
          nullable: true

    # -----------------------------------------------------------------------
    # Response / request envelopes
    # -----------------------------------------------------------------------
    AlertListResponse:
      type: object
      required:
        - alerts
        - count
      properties:
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
        count:
          type: integer
          example: 3

    AlertDetailResponse:
      type: object
      required:
        - alert
      properties:
        alert:
          $ref: "#/components/schemas/Alert"

    StatusTransitionResponse:
      type: object
      required:
        - alertId
        - status
      properties:
        alertId:
          type: string
          example: alert-8f2c
        status:
          $ref: "#/components/schemas/AlertStatus"

    ApprovalRequest:
      type: object
      required:
        - decision
      properties:
        decision:
          type: string
          enum: [approve, reject]
          description: The approval decision (case-insensitive)
          example: approve
        selectedOption:
          type: string
          nullable: true
          description: Approved ranked-option label (required to approve when the brief has options)
          example: A

    ApprovalResponse:
      type: object
      required:
        - accepted
        - approvalState
        - executed
      properties:
        accepted:
          type: boolean
          example: true
        approvalState:
          $ref: "#/components/schemas/ApprovalState"
        selectedOption:
          type: string
          nullable: true
          example: A
        executed:
          type: boolean
          description: Whether the Action Executor ran the write-back (true only on accepted approval)
          example: true
        execution:
          type: object
          description: Action Executor summary (present when a decision executes)
          additionalProperties: true
          example:
            executed: true
            resolvedAlertId: alert-8f2c

    RuleDefinition:
      type: object
      description: A persisted pulse-rules item
      required:
        - propertyId
        - ruleType
        - tier
        - triggerCondition
        - agentTriageEnabled
        - escalationTimeoutSec
        - enabled
      properties:
        propertyId:
          type: string
          example: ALOHA-CHI-001
        ruleType:
          $ref: "#/components/schemas/AlertType"
        tier:
          $ref: "#/components/schemas/AlertTier"
        triggerCondition:
          $ref: "#/components/schemas/TriggerCondition"
        parameters:
          type: object
          description: Rule-type-specific thresholds
          additionalProperties: true
          example:
            loyaltyProtectionTier: Gold
        agentTriageEnabled:
          type: boolean
          example: true
        escalationTimeoutSec:
          type: integer
          minimum: 60
          maximum: 86400
          description: Stored escalation timeout in seconds (inclusive range)
          example: 300
        enabled:
          type: boolean
          example: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        updatedBy:
          type: string
          nullable: true

    TriggerCondition:
      type: object
      description: Declarative, non-eval trigger-condition model
      properties:
        operator:
          type: string
          description: Comparison operator (e.g. gt, gte, eq, lte, overlaps)
          example: gt
        left:
          type: string
          example: reservations.confirmed
        right:
          description: Operand (string reference or literal value)
          example: rooms.available
      additionalProperties: true

    RulesListResponse:
      type: object
      required:
        - rules
        - count
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/RuleDefinition"
        count:
          type: integer
          example: 6

    RuleUpdate:
      type: object
      description: |
        Rule-definition update body. `propertyId` and `ruleType` are taken from
        the composite `{ruleId}` path and need not be repeated in the body.
      required:
        - tier
        - triggerCondition
        - agentTriageEnabled
        - escalationTimeoutSec
        - enabled
      properties:
        tier:
          $ref: "#/components/schemas/AlertTier"
        triggerCondition:
          $ref: "#/components/schemas/TriggerCondition"
        parameters:
          type: object
          additionalProperties: true
        agentTriageEnabled:
          type: boolean
        escalationTimeoutSec:
          type: integer
          minimum: 60
          maximum: 86400
        enabled:
          type: boolean

    RuleUpdateResponse:
      type: object
      required:
        - accepted
        - rule
      properties:
        accepted:
          type: boolean
          example: true
        rule:
          $ref: "#/components/schemas/RuleDefinition"

    PushSubscriptionRequest:
      type: object
      required:
        - endpoint
        - p256dh
        - auth
      properties:
        endpoint:
          type: string
          format: uri
          description: The push service endpoint URL
          example: https://web.push.apple.com/Qf...
        p256dh:
          type: string
          description: Client public key (base64url)
          example: BPx...
        auth:
          type: string
          description: Client auth secret (base64url)
          example: k9d...

    PushSubscriptionResponse:
      type: object
      required:
        - registered
        - endpointHash
      properties:
        registered:
          type: boolean
          example: true
        endpointHash:
          type: string
          description: SHA-256 hash of the endpoint (stable sort key)
          example: 3b1f9a...c7

    VapidPublicKeyResponse:
      type: object
      required:
        - publicKey
      properties:
        publicKey:
          type: string
          description: VAPID application server public key
          example: BPx...

    RealtimeConfigResponse:
      type: object
      required:
        - httpEndpoint
        - wssEndpoint
        - namespace
      properties:
        httpEndpoint:
          type: string
          description: AppSync Events HTTP publish endpoint
          example: https://abc123.appsync-api.us-east-1.amazonaws.com/event
        wssEndpoint:
          type: string
          description: AppSync Events WebSocket subscribe endpoint
          example: wss://abc123.appsync-realtime-api.us-east-1.amazonaws.com/event
        namespace:
          type: string
          description: The PULSE channel namespace
          example: pulse

    VipGuest:
      type: object
      description: A VIP guest profile (sensitive notes stripped)
      properties:
        guestId:
          type: string
          example: ALH-MBR-00238471
        guestName:
          type: string
          example: David Chen
        initials:
          type: string
          example: DC
        loyaltyTier:
          type: string
          example: AMBASSADOR
        totalStays:
          type: integer
          example: 47
        roomNumber:
          type: string
          example: "2401"
        roomType:
          type: string
          example: SUITE
        specialOccasion:
          type: string
          nullable: true
          example: ANNIVERSARY
        preferences:
          type: array
          items:
            type: string
          example: [HIGH_FLOOR, FEATHER_FREE_BEDDING]
        accountType:
          type: string
          example: PERSONAL
      additionalProperties: true

    TierGroup:
      type: object
      description: VIP guests grouped under one loyalty tier
      required:
        - tier
        - count
        - guests
      properties:
        tier:
          type: string
          example: AMBASSADOR
        count:
          type: integer
          example: 3
        guests:
          type: array
          items:
            $ref: "#/components/schemas/VipGuest"

    VipsResponse:
      type: object
      required:
        - propertyId
        - vipCount
        - tiers
      properties:
        propertyId:
          type: string
          example: ALOHA-CHI-001
        date:
          type: string
          format: date
          nullable: true
          example: "2026-08-17"
        vipCount:
          type: integer
          example: 7
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/TierGroup"

    WorkOrderCard:
      type: object
      description: The work-order status joined onto an OOO room card
      nullable: true
      properties:
        workOrderId:
          type: string
          example: WO-CHI-0146
        status:
          type: string
          example: IN_PROGRESS
        priority:
          type: string
          example: HIGH
        issueType:
          type: string
          example: IT_NETWORK
        assignedTo:
          type: string
          example: eng-team-2
        createdAt:
          type: string
          format: date-time
          example: "2026-08-17T05:14:00Z"
        estimatedResolutionHours:
          type: integer
          example: 3

    OooRoomCard:
      type: object
      description: An out-of-order room card annotated with its work-order status
      properties:
        roomNumber:
          type: string
          example: "2102"
        roomType:
          type: string
          example: KING_DELUXE
        status:
          type: string
          example: OUT_OF_ORDER
        floor:
          type: integer
          example: 21
        view:
          type: string
          example: LAKE
        isPremiumRoom:
          type: boolean
          example: true
        workOrder:
          $ref: "#/components/schemas/WorkOrderCard"

    Facility:
      type: object
      description: Facility summary for the Ops tab
      properties:
        occupancyPct:
          type: number
          example: 87
        arrivalsTotal:
          type: integer
          example: 142
        departuresTotal:
          type: integer
          example: 118
        confirmedReservations:
          type: integer
          example: 374
        availableRooms:
          type: integer
          description: Legacy name for total room inventory capacity, not remaining vacancy.
          example: 368
        oooCount:
          type: integer
          example: 4
        openWorkOrders:
          type: integer
          example: 6

    GroupCheckout:
      type: object
      description: Group-checkout summary for the Ops tab
      properties:
        departuresTotal:
          type: integer
          example: 118
        availableRooms:
          type: integer
          description: Legacy name for total room inventory capacity, not remaining vacancy.
          example: 368
        confirmedReservations:
          type: integer
          example: 374

    OpsResponse:
      type: object
      required:
        - propertyId
        - facility
        - oooRooms
        - groupCheckout
      properties:
        propertyId:
          type: string
          example: ALOHA-CHI-001
        date:
          type: string
          format: date
          nullable: true
          example: "2026-08-17"
        facility:
          $ref: "#/components/schemas/Facility"
        oooRooms:
          type: array
          items:
            $ref: "#/components/schemas/OooRoomCard"
        groupCheckout:
          $ref: "#/components/schemas/GroupCheckout"

    KitchenSnapshot:
      type: object
      required: [propertyId, banquetCountdown, fbStats, deliverySla, kitchenOrders, channelMix, channelMixNote]
      properties:
        propertyId:
          type: string
        banquetCountdown:
          type: object
          nullable: true
          properties:
            title: {type: string}
            badge: {type: string}
            minutesRemaining: {type: integer}
            progressPct: {type: integer}
            subline: {type: string}
        fbStats:
          type: array
          description: Daily summary; Orders delta reports the active kitchenOrders count.
          items:
            type: object
            properties:
              label: {type: string}
              value: {type: string}
              delta: {type: string}
              deltaTone: {type: string, enum: [success, warning]}
        deliverySla:
          type: object
          nullable: true
          properties:
            label: {type: string}
            pct: {type: integer}
            avgLabel: {type: string}
            targetLabel: {type: string}
            atRisk: {type: integer}
            standardLabel: {type: string}
        kitchenOrders:
          type: array
          description: Complete active order feed for this curated snapshot; its length determines the in-flight count.
          items:
            type: object
            properties:
              id: {type: string}
              kind: {type: string, enum: [room-service, banquet, fnb, external]}
              title: {type: string}
              detail: {type: string}
              elapsedLabel: {type: string}
              slaState: {type: string, enum: [on-time, at-risk, breached]}
              slaLabel: {type: string}
        channelMix:
          type: array
          items:
            type: object
            properties:
              label: {type: string}
              pct: {type: integer}
              warning: {type: boolean}
        channelMixNote:
          type: string

    DemoScenarioResponse:
      type: object
      description: Summary of a demo scenario mutation (demo-only)
      required:
        - scenarioId
        - action
        - operation
        - tableKind
        - expectedAlertType
      properties:
        scenarioId:
          type: string
          example: walk-risk
        action:
          type: string
          enum: [run, reset]
          example: run
        operation:
          type: string
          description: The DynamoDB operation applied (INSERT / MODIFY / REMOVE)
          example: MODIFY
        tableKind:
          type: string
          description: The operational table kind mutated
          example: reservations
        expectedAlertType:
          $ref: "#/components/schemas/AlertType"
