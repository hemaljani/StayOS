# =============================================================================
# AgentCore Runtime Configuration - PULSE Forecasting Agent
# =============================================================================
# Documents the runtime configuration for deploying the PULSE Forecasting Agent
# to Amazon Bedrock AgentCore Runtime. This mirrors the PULSE Triage Agent's
# agentcore.yaml one-for-one (the proven StayOS platform pattern): both PULSE
# agents run as Strands agents on AgentCore Runtime, sharing the container build
# (Finch), the IAM-signed Gateway MCP connection scaffold, and the session
# lifecycle.
#
# DEPLOYMENT METHOD: CodeBuild + AWS CLI
# --------------------------------------
# Deployment is automated out-of-band from the CloudFormation nested stacks
# (matching the Triage Agent / LUMI agent model):
#   1. CodeBuild builds an ARM64 container image (Containerfile) and pushes to ECR
#   2. AWS CLI (`aws bedrock-agentcore-control`) creates/updates the runtime
#   3. The runtime ARN is written to SSM /${StackPrefix}/forecast/runtime-arn so
#      the pulse-forecaster-invoker Lambda can InvokeAgentRuntime.
#
# The AgentCore CLI (`agentcore deploy`) is NOT used; build is via Finch/CodeBuild.
# =============================================================================

# -------------------------------------------------------------------
# Agent Metadata
# -------------------------------------------------------------------
agent:
  name: pulse-forecaster
  description: >
    PULSE forecasting agent for hotel General Managers. Runs AHEAD of the
    reactive Rule Engine on a per-property daily schedule: EventBridge Scheduler
    (property-local midnight) invokes the pulse-forecaster-invoker Lambda, which
    starts an AgentCore Runtime session with {propertyId}. A Strands Agent reads
    forward-looking signals (get_occupancy / get_revenue /
    get_sister_property_availability) through the shared StayOS AgentCore Gateway
    (MCP), runs a PURE deterministic Forecast Engine to predict an oversell /
    walk risk (rooms oversold, anticipated date, integer 0-100 confidence - never
    model-generated), has Claude Sonnet AUTHOR a Remediation_Plan around those
    fixed numbers (deterministic template fallback if the model is unavailable),
    then emits an advisory FORECAST_OVERSELL alert into pulse-alerts and
    publishes ALERT_UPDATED / ALERT_RESOLVED via the shared realtime helper.
    Advisory only: FORECAST_OVERSELL is excluded from the Action Executor's
    RESOLVABLE_TYPES and never auto-executes a write-back.

# -------------------------------------------------------------------
# Runtime Configuration
# -------------------------------------------------------------------
runtime:
  # Python 3.12 runtime environment (matches requirements.txt / Containerfile)
  language: python3.12

  # ARM64 (Graviton) for cost efficiency, matching the Triage Agent
  architecture: arm64

  # Application entry point - BedrockAgentCoreApp starts Uvicorn on port 8080
  entrypoint: app.py

  # AgentCore protocol contract requires port 8080
  port: 8080

  # Container-based deployment via CodeBuild + ECR (built from the Containerfile
  # in this directory, which also bundles the pulse package)
  buildType: Container

# -------------------------------------------------------------------
# Environment Variables
# -------------------------------------------------------------------
# Set on the deployed AgentCore container via the create/update-agent-runtime
# CLI call. Values come from CloudFormation stack outputs and SSM Parameter
# Store (never hardcoded; PYQUALITY-06 / NAMING-02).
# -------------------------------------------------------------------
environment:
  # Shared StayOS AgentCore Gateway MCP endpoint (Streamable HTTP, IAM auth).
  # Sourced from SSM /${StackPrefix}/gateway/endpoint-url (the SAME shared
  # Gateway the Triage Agent and LUMI chat agent use; no new gateway/tools).
  GATEWAY_ENDPOINT_URL: <from-ssm:/pulse/gateway/endpoint-url>

  # Bedrock model id used to AUTHOR the Remediation_Plan (matches the Triage
  # Agent / LUMI chat model). Never hardcoded - the approved model can change
  # without code (PYQUALITY-06).
  FORECAST_MODEL_ID: us.anthropic.claude-sonnet-4-6

  # pulse-alerts physical table name - the FORECAST_OVERSELL write target.
  ALERTS_TABLE_NAME: <from-cloudformation:PulseDataStack.Outputs.AlertsTableName>

  # AppSync Events HTTP publish endpoint for ALERT_UPDATED / ALERT_RESOLVED
  # (best-effort; the publish is skipped when unset). From the pulse-api realtime API.
  REALTIME_HTTP_ENDPOINT: <from-cloudformation:PulseApiStack.Outputs.RealtimeHttpEndpoint>

  # Comma-delimited list of forecasting-enabled propertyIds (the invocation gate,
  # Req 1.4/1.5). Sourced from CloudFormation - never hardcoded.
  FORECAST_ENABLED_PROPERTY_IDS: <from-cloudformation:PulseApiStack.Outputs.ForecastEnabledPropertyIds>

  # Forecast horizon in days (default 14, bounded 1..14 - Req 3.1).
  FORECAST_HORIZON_DAYS: "14"

  # Minimum confidence (integer 0-100) required to write an alert (Req 4.1).
  FORECAST_CONFIDENCE_THRESHOLD: "50"

  # Minimum per-date data points required to evaluate a date (Req 3.3).
  FORECAST_MIN_DATA_POINTS: "3"

  # Powertools structured-logging service name marker.
  POWERTOOLS_SERVICE_NAME: pulse-forecaster

  # AWS region for the Gateway SigV4 signer, Bedrock, and boto3 clients.
  AWS_DEFAULT_REGION: us-east-1

  # Structured logging level.
  LOG_LEVEL: INFO

# -------------------------------------------------------------------
# IAM Execution Role
# -------------------------------------------------------------------
# The AgentCore container assumes this role at runtime. It provides:
# - bedrock-agentcore:InvokeGateway for MCP tool discovery and invocation
# - bedrock:InvokeModel on the Claude Sonnet cross-region inference profile
#   (+ underlying foundation models) to AUTHOR the Remediation_Plan
# - dynamodb:PutItem / UpdateItem / Query / GetItem on pulse-alerts + its indexes
# - appsync:EventPublish scoped to the PULSE realtime API (ALERT_UPDATED / RESOLVED)
# - ssm:GetParameter on the gateway endpoint + forecast runtime config params
# - ecr image pull + CloudWatch Logs write + X-Ray put actions
#
# Advisory posture (Req 5): NO LUMI-table write, NO TransactWriteItems, NO
# executor invoke - the role cannot resolve/execute anything.
#
# Defined in: pulse/infrastructure/nested-stacks/pulse-api.yaml
#   (ForecasterAgentCoreRole)
# Naming pattern: ${StackPrefix}-forecaster-role-${AWS::Region}
# -------------------------------------------------------------------
iam:
  executionRoleArn: arn:aws:iam::<ACCOUNT_ID>:role/pulse-forecaster-role-us-east-1

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
# Container logs route to CloudWatch Logs via Powertools Logger (structured
# JSON). The log group is created by CloudFormation with 14-day retention.
#
# Defined in: pulse/infrastructure/nested-stacks/pulse-api.yaml
#   (ForecasterAgentCoreLogGroup)
# -------------------------------------------------------------------
logging:
  logGroupName: /pulse/agentcore/forecast-agent
  retentionDays: 14

# -------------------------------------------------------------------
# Lifecycle Configuration
# -------------------------------------------------------------------
# This is a per-property request-response service (one invocation forecasts one
# property's horizon), so it holds no long-lived sessions. Each property's run
# is an independent Scheduler -> invoker -> session flow, so an error is
# contained to that property's run (Req 8.3). maxLifetime is the platform
# default; no invocation should approach it.
# -------------------------------------------------------------------
lifecycle:
  # Reclaim the microVM after this idle period between invocations (seconds).
  idleRuntimeSessionTimeout: 900

  # Maximum container lifetime (seconds) - 8 hours absolute cap.
  maxLifetime: 28800

# -------------------------------------------------------------------
# Health Check (AgentCore Protocol Contract)
# -------------------------------------------------------------------
# The container implements GET /ping returning {"status": "Healthy"} (this is a
# stateless request-response service, so it never reports HealthyBusy).
# -------------------------------------------------------------------
healthCheck:
  endpoint: /ping
  healthyResponse: '{"status": "Healthy"}'

# =============================================================================
# DEPLOYMENT WORKFLOW (out-of-band from the nested stacks)
# =============================================================================
#
# Prerequisites:
#   1. Deploy the CloudFormation stacks (creates the IAM role, ECR repo,
#      CodeBuild project, log group, and SSM params):
#      $ make deploy-infra
#   2. Ensure the shared StayOS Gateway endpoint is in SSM
#      /${StackPrefix}/gateway/endpoint-url and the PULSE tools are registered
#      on its target (reused - no new gateway/tools).
#
# Build (ARM64 container image via CodeBuild):
#   - Stage backend/src/pulse into the build context as ./pulse
#   - Zip the forecast-agent source (excluding tests/__pycache__/agentcore.yaml)
#   - Trigger CodeBuild (Graviton, native ARM64); the image is pushed to ECR
#     ${AccountId}.dkr.ecr.${Region}.amazonaws.com/pulse-forecast-agent:latest
#   Local equivalent (AWS Finch, not docker):
#     $ finch build --platform linux/arm64 -t pulse-forecast-agent -f Containerfile .
#
# Deploy (AgentCore Runtime via AWS CLI):
#   - First deploy: `aws bedrock-agentcore-control create-agent-runtime`
#     (container config, role ARN, env vars incl. GATEWAY_ENDPOINT_URL from SSM,
#     network mode PUBLIC); save the runtime ARN to SSM
#     /${StackPrefix}/forecast/runtime-arn (consumed by the invoker Lambda)
#   - Subsequent deploys: `aws bedrock-agentcore-control update-agent-runtime`
#   - Runtime name: ${StackPrefix}_forecaster
#
# Local development:
#   $ cd backend/services/forecast-agent
#   $ PYTHONPATH=../../src python app.py   # serves on http://localhost:8080
#   # Set GATEWAY_ENDPOINT_URL, FORECAST_MODEL_ID, ALERTS_TABLE_NAME,
#   # REALTIME_HTTP_ENDPOINT, FORECAST_ENABLED_PROPERTY_IDS, AWS_DEFAULT_REGION
#   # in your shell or .env first.
# =============================================================================
