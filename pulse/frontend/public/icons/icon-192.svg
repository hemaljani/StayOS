<?xml version="1.0" encoding="UTF-8"?>
<!-- PULSE app icon (192x192). Lightning bolt on the StayOS dark background with
     the tri-tone PULSE gradient (critical red -> warning amber -> info blue). -->
<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5f6d"/>
      <stop offset="50%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#6b8fff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#080c18"/>
  <path d="M300 56 L150 288 H244 L212 456 L372 214 H272 Z" fill="url(#pulseGrad)"/>
</svg>
